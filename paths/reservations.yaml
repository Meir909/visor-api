      - admin-reservations
    summary: Утвердить продление
    operationId: adminApproveExtension
    description: |-
      Утверждение запроса на продление: `PENDING → APPROVED`.
      Продлевает `endAt` брони с перепроверкой пересечений; доп. сумма фиксируется как цена-снимок.
      Отправляет команду продления сессии в Provider (асинхронно).

      **Ошибки:** `422 EXTENSION_NOT_ALLOWED` (бронь в недопустимом статусе или перевышен лимит), `409 RESERVATION_SLOT_CONFLICT`.

      **Разрешение:** `reservation.extension.approve.club`.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.extension.approve.club
    x-business-rules:
      - Только для запроса в статусе PENDING.
      - Суммарная длительность не более 10 часов.
      - Перепроверка пересечений на новый интервал.
    parameters:
      - $ref: '../components/parameters.yaml#/ExtensionId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              additionalAmountMinor:
                type: string
                pattern: '^-?\d+$'
                description: Дополнительная сумма за продление (minor units, строка).
              currency:
                type: string
                minLength: 3
                maxLength: 3
                pattern: '^[A-Z]{3}$'
                description: ISO 4217 (должна совпадать с валютой брони).
              note:
                type: string
                maxLength: 500
                description: Комментарий к утверждению.
    responses:
      '200':
        description: Бронирование после продления.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationDetails.yaml'
                meta:
                  $ref: '../schemas/ReservationMeta.yaml'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
