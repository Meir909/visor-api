'/reservations/{reservationId}/cancel':
  post:
    tags:
      - reservations
    summary: Отменить бронирование
    operationId: cancelReservation
    description: |-
      Отмена бронирования.

      **Правила:**
      - Игрок может отменить до начала; отмена позже cutoff (обычно за 3 часа до старта) запрещена → `422 CANCELLATION_NOT_ALLOWED`.
      - Администратор может отменить до завершения; `reason` обязателен.
      - Отмена активной (`CHECKED_IN`/`ACTIVE`) брони → `409 RESERVATION_ALREADY_ACTIVE` (используйте `complete`).
      - Слот(ы) освобождаются; депозит возвращается по политике клуба.

      **Разрешения:** `reservation.cancel.self` / `reservation.cancel.club`.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.cancel.self
      - reservation.cancel.club
    x-business-rules:
      - Отмена игроком не позднее cutoff (по умолчанию за 3 часа).
      - Освобождение слота после отмены.
    parameters:
      - $ref: '../components/parameters.yaml#/ReservationId'
      - $ref: '../components/parameters.yaml#/IdempotencyKeyOptional'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ReservationCancelRequest.yaml'
          examples:
            cancel:
              value:
                reason: Передумал
                notifyPlayer: true
    responses:
      '200':
        description: Отменённое бронирование.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationDetails.yaml'
                meta:
                  $ref: '../schemas/ReservationMeta.yaml'
            examples:
              cancelled:
                $ref: '../components/examples.yaml#/CancellationExample'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

'/reservations/{reservationId}/extensions':
  post:
    tags:
      - reservations
    summary: Запросить продление брони
    operationId: requestReservationExtension
    description: |-
      Создаёт запрос на продление брони. Запрос не меняет бронь до утверждения администратором.

      **Правила:**
      - `requestedEndAt` строго позже текущего `endAt`.
      - Суммарная длительность не более 10 часов.
      - Бронь должна быть в статусе `CHECKED_IN` или `ACTIVE` → иначе `422 EXTENSION_NOT_ALLOWED`.
      - На новый интервал не должно быть пересечений → `409 RESERVATION_SLOT_CONFLICT`.

      **Разрешение:** `reservation.extend.self`.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.extend.self
    x-business-rules:
      - Продление утверждает администратор.
      - Запрос не меняет бронь до решения.
    parameters:
      - $ref: '../components/parameters.yaml#/ReservationId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ReservationExtensionRequestCreate.yaml'
          examples:
            extend:
              value:
                requestedEndAt: '2026-08-04T19:00:00Z'
                reason: Хочу поиграть ещё
    responses:
      '201':
        description: Запрос на продление создан.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationExtensionRequest.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              extensionRequest:
                $ref: '../components/examples.yaml#/ExtensionRequestExample'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

