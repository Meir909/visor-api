# =====================================================================
# Visora API — Paths модуля Reservations
# =====================================================================

'/reservations':
  post:
    tags:
      - reservations
    summary: Создать бронирование
    operationId: createReservation
    description: |-
      Создаёт новое бронирование в клубе.

      **Разрешения:** `reservation.create.self` (PLAYER) / `reservation.create.club` (CLUB_ADMIN, ORG_OWNER).

      **Идемпотентность:** обязательный заголовок `Idempotency-Key`.

      **Бизнес-правила:**
      - Ресурсы: один VIP room либо от 1 до 10 компьютеров; смешивать типы запрещено.
      - Длительность: от минимальной (конфигурируемой клубом) до 10 часов.
      - Начало — не позднее чем через 24 часа от текущего момента (горизонт бронирования); бронь можно создать за 2–3 часа до начала.
      - Интервал должен попадать в рабочие часы клуба и не пересекаться с закрытиями.
      - Проекция состояния ресурса от Provider должна быть свежей (policy доступности клуба).
      - Финальная защита от пересечений — PostgreSQL exclusion constraint.

      **Валидация:** `clubId`, `resourceIds[*]` — UUID; `startAt`/`endAt` — ISO 8601; `endAt > startAt`; `participantCount >= 1`; `notes` ≤ 1000 символов.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.create.self
      - reservation.create.club
    x-business-rules:
      - Максимум 10 часов.
      - Начало — максимум через 24 часа от текущего момента (нельзя бронировать дальше суток вперёд).
      - Один VIP room либо компьютеры (без смешивания).
      - Запрет пересечений с активными бронями.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ReservationCreateRequest.yaml'
          examples:
            createReservation:
              $ref: '../components/examples.yaml#/CreateReservationRequest'
    responses:
      '201':
        description: Бронирование создано.
        headers:
          Location:
            description: URL созданного бронирования.
            schema:
              type: string
              format: uri-reference
            example: /api/v1/reservations/2cd0f5a8-3e2f-4f8a-9b1c-8d7e6f5a4b3c
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationDetails.yaml'
                meta:
                  $ref: '../schemas/ReservationMeta.yaml'
            examples:
              createReservation:
                $ref: '../components/examples.yaml#/CreateReservationResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
  get:
    tags:
      - reservations
    summary: Список бронирований
    operationId: listReservations
    description: |-
      Возвращает список бронирований с фильтрацией, поиском и пагинацией.

      **Доступ:** PLAYER видит только свои брони; CLUB_ADMIN/ORG_OWNER видят брони в scope клуба/организации.

      **Разрешения:** `reservation.read.self` / `reservation.read.club`.

      **Фильтры:** `status`, `clubId`, `playerId` (только staff), `resourceId`, `resourceType`, `from`/`to`, `q` (поиск по номеру, имени/телефону игрока).
      **Сортировка:** `sort=startAt:desc` (поля: `startAt`, `endAt`, `createdAt`, `totalMinor`).
      **Пагинация:** `page`, `pageSize`.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.read.self
      - reservation.read.club
    parameters:
      - $ref: '../components/parameters.yaml#/StatusFilter'
      - $ref: '../components/parameters.yaml#/ClubIdQuery'
      - $ref: '../components/parameters.yaml#/PlayerId'
      - $ref: '../components/parameters.yaml#/ResourceId'
      - $ref: '../components/parameters.yaml#/ResourceTypeQuery'
      - $ref: '../components/parameters.yaml#/From'
      - $ref: '../components/parameters.yaml#/To'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Page'
      - $ref: '../components/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Список бронирований.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/ReservationSummary.yaml'
                meta:
                  $ref: '../schemas/PageMeta.yaml'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

'/reservations/current':
  get:
    tags:
      - reservations
    summary: Текущее бронирование игрока
    operationId: getCurrentReservation
    description: |-
      Возвращает текущее активное бронирование вызывающего игрока (статусы `CHECKED_IN` или `ACTIVE`).
      Если активной брони нет — `data: null` (не является ошибкой).

      **Разрешение:** `reservation.read.self`.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.read.self
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Текущее бронирование (может быть null).
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  anyOf:
                    - $ref: '../schemas/ReservationDetails.yaml'
                    - type: 'null'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

'/reservations/validate':
  post:
    tags:
      - reservations
    summary: Валидация бронирования
    operationId: validateReservation
    description: |-
      Проверяет возможность создания брони без фактического создания.
      Выполняет те же бизнес-проверки и проверку пересечений, возвращает конфликты и предупреждения.

      **Разрешение:** `reservation.create.self`.

      **Примечание:** предварительная проверка улучшает UX, но финальную защиту обеспечивает PostgreSQL exclusion constraint.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.create.self
    x-business-rules:
      - Не создаёт бронь, только проверяет.
      - Проверяет пересечения, часы работы, длительность и горизонт брони.
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ReservationCreateRequest.yaml'
          examples:
            createReservation:
              $ref: '../components/examples.yaml#/CreateReservationRequest'
    responses:
      '200':
        description: Результат валидации.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationValidation.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

'/reservations/availability':
  get:
    tags:
      - reservations
    summary: Проверить доступность
    operationId: checkReservationAvailability
    description: |-
      Возвращает доступность ресурсов клуба в интервале `from`–`to`.
      Сливает: расписание и закрытия клуба, пересечения с активными бронями и (при `includeState=true`) проекцию состояния Provider с freshness.

      **Разрешение:** `reservation.read.self`.

      **Параметры:** `clubId` (обязателен), `from`, `to` (ISO 8601, интервал не более 24 часов), `resourceType`, `resourceId`, `zoneIds`.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.read.self
    parameters:
      - $ref: '../components/parameters.yaml#/ClubIdQuery'
      - $ref: '../components/parameters.yaml#/From'
      - $ref: '../components/parameters.yaml#/To'
      - $ref: '../components/parameters.yaml#/ResourceTypeQuery'
      - $ref: '../components/parameters.yaml#/ResourceId'
      - $ref: '../components/parameters.yaml#/ZoneIds'
      - $ref: '../components/parameters.yaml#/IncludeState'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Доступность ресурсов.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationAvailability.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              availability:
                $ref: '../components/examples.yaml#/AvailabilityCheckExample'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

'/reservations/{reservationId}':
  get:
    tags:
      - reservations
    summary: Детали бронирования
    operationId: getReservation
    description: |-
      Полные детали бронирования: выделенные ресурсы, участники, история продлений и доступные действия.

      **Разрешения:** `reservation.read.self` (только свои) / `reservation.read.club` (staff).
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.read.self
      - reservation.read.club
    parameters:
      - $ref: '../components/parameters.yaml#/ReservationId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Детали бронирования.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationDetails.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              details:
                $ref: '../components/examples.yaml#/ReservationDetailsExample'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  patch:
    tags:
      - admin-reservations
    summary: Обновить бронирование
    operationId: adminUpdateReservation
    description: |-
      Обновление бронирования администратором (заметки, число участников, перенос времени).

      **Требуется `If-Match`** с текущей `version`; при расхождении — `409 VERSION_CONFLICT`.

      **Правила:** перенос времени повторно проверяет пересечения и рабочие часы; при переносе времени обязателен `reason`.

      **Разрешение:** `reservation.update.club`.
    security:
      - bearerAuth: []
    x-permissions:
      - reservation.update.club
    x-business-rules:
      - Перенос времени повторно проверяет пересечения.
      - Изменение времени аудируется.
    parameters:
      - $ref: '../components/parameters.yaml#/ReservationId'
      - $ref: '../components/parameters.yaml#/IfMatch'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ReservationUpdateRequest.yaml'
    responses:
      '200':
        description: Обновлённое бронирование.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/ReservationDetails.yaml'
                meta:
                  $ref: '../schemas/ReservationMeta.yaml'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

