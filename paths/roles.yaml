# =====================================================================
# Visora API — Paths модуля Roles (RBAC: ORG_OWNER > CLUB_ADMIN > PLAYER)
# =====================================================================

'/roles':
  get:
    tags:
      - roles
    summary: Каталог ролей
    operationId: listRoles
    description: |-
      Возвращает каталог системных ролей с иерархией, scope и permissions. Каталог стабилен (коды не изменяются после релиза); служит источником прав для UI.

      **Иерархия:** `ORG_OWNER` (3) > `CLUB_ADMIN` (2) > `PLAYER` (1); `PLATFORM_ADMIN` (4) зарезервирован и не назначается в MVP.
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Каталог системных ролей.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/Role.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              roleCatalog:
                $ref: '../components/examples.yaml#/RoleCatalogExample'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

'/me/roles':
  get:
    tags:
      - roles
    summary: Мой доступ (роли и tenants)
    operationId: getMyAccess
    description: |-
      Возвращает AuthContext текущего пользователя: платформенные роли и memberships с ролями и клубными scope.

      - Membership и роли **не кешируются в токене** — API резолвит их из базы/short-lived кеша при каждом запросе.
      - Используется фронтендом для отображения разделов; авторизация операций всё равно выполняется на сервере.
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Доступ текущего пользователя.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/MyAccess.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              myAccess:
                $ref: '../components/examples.yaml#/MyAccessExample'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

'/me/memberships':
  get:
    tags:
      - roles
    summary: Мои memberships
    operationId: getMyMemberships
    description: |
      Список организаций текущего пользователя со статусом и ролями. Включает только ACTIVE/SUSPENDED; INVITED приглашения отдельно в `/me/invitations`.
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Список memberships пользователя.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/Membership.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              myMemberships:
                value:
                  data:
                    - id: f1e2d3c4-b5a6-4c7d-8e9f-0a1b2c3d4e5f
                      organizationId: 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                      organizationName: Caspian Esports
                      userId: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d
                      status: ACTIVE
                      roles:
                        - code: CLUB_ADMIN
                          clubIds:
                            - 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                      acceptedAt: '2026-07-10T14:30:00Z'
                      createdAt: '2026-07-10T12:00:00Z'
                      updatedAt: '2026-07-10T14:30:00Z'
                  meta:
                    requestId: 4b1c9d8e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
                    timestamp: '2026-08-04T10:20:00Z'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

'/me/invitations':
  get:
    tags:
      - roles
    summary: Мои приглашения
    operationId: getMyInvitations
    description: |
      Ожидающие приглашения в организации (membership со статусом `INVITED`). Приглашение может истечь (`expiresAt`); после истечения `accept` возвращает `410 INVITATION_NOT_FOUND`.
    parameters:
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Список ожидающих приглашений.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/InvitationSummary.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              invitations:
                value:
                  data:
                    - id: e6f7a8b9-0c1d-4e2f-8a3b-4c5d6e7f8a9b
                      organizationId: 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                      organizationName: Caspian Esports
                      invitedByUserId: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d
                      invitedAt: '2026-08-04T10:30:00Z'
                      expiresAt: '2026-08-11T10:30:00Z'
                  meta:
                    requestId: 4b1c9d8e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
                    timestamp: '2026-08-04T10:31:00Z'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

'/me/invitations/{invitationId}/accept':
  post:
    tags:
      - roles
    summary: Принять приглашение
    operationId: acceptInvitation
    description: |
      Принимает приглашение: membership переходит в `ACTIVE`, заполняется `acceptedAt`, роли вступают в силу.

      - Принять может только приглашённый пользователь.
      - Повторный accept идемпотентен: уже активный membership возвращает 200.
      - Истёкшее/отозванное приглашение — `410` / `404 INVITATION_NOT_FOUND`.
    parameters:
      - $ref: '../components/parameters.yaml#/InvitationId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Приглашение принято, membership активен.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/Membership.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'

'/me/invitations/{invitationId}/decline':
  post:
    tags:
      - roles
    summary: Отклонить приглашение
    operationId: declineInvitation
    description: |
      Отклоняет приглашение: membership переводится в `REVOKED` (отклонено). Отклонивший не может быть приглашён заново без нового invite.
    parameters:
      - $ref: '../components/parameters.yaml#/InvitationId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '204':
        description: Приглашение отклонено.
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

'/organizations/{organizationId}/members':
  post:
    tags:
      - roles-admin
    summary: Пригласить участника
    operationId: inviteMember
    description: |-
      Создаёт membership со статусом `INVITED` (приглашение) для существующего пользователя или по телефону.

      **Разрешение:** `membership.manage.organization` (ORG_OWNER).

      **Правила иерархии:**
      - Можно назначать только роли **строго ниже** своей (Owner назначает Admin, не другого Owner).
      - `CLUB_ADMIN` требует минимум один `clubId` (иначе `422 INVALID_ROLE_SCOPE`).
      - `ORG_OWNER` нельзя назначать через invite; второй Owner создаётся только явной передачей роли существующему Admin (`PATCH member` с прохождением иерархической проверки).
      - Активный membership с тем же `(organization_id, user_id)` → `409 MEMBER_ALREADY_EXISTS`.

      **Идемпотентность:** заголовок `Idempotency-Key` (UUID).
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/MemberInviteRequest.yaml'
          examples:
            inviteAdmin:
              value:
                userId: 6b7c8d9e-0f1a-4b2c-8d3e-4f5a6b7c8d9e
                roleCode: CLUB_ADMIN
                clubIds:
                  - 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                message: Приглашаем в команду администраторов
    responses:
      '201':
        description: Приглашение создано (membership INVITED).
        headers:
          Location:
            description: URL созданного membership.
            schema:
              type: string
              format: uri-reference
            example: /api/v1/organizations/4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f/members/6b7c8d9e-0f1a-4b2c-8d3e-4f5a6b7c8d9e
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/Membership.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              invited:
                value:
                  data:
                    id: e6f7a8b9-0c1d-4e2f-8a3b-4c5d6e7f8a9b
                    organizationId: 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                    organizationName: Caspian Esports
                    userId: 6b7c8d9e-0f1a-4b2c-8d3e-4f5a6b7c8d9e
                    user:
                      id: 6b7c8d9e-0f1a-4b2c-8d3e-4f5a6b7c8d9e
                      displayName: Aigerim
                      maskedPhone: +7 705 *** 12 34
                      status: ACTIVE
                    status: INVITED
                    roles:
                      - code: CLUB_ADMIN
                        clubIds:
                          - 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                    invitedByUserId: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d
                    invitedAt: '2026-08-04T10:30:00Z'
                    createdAt: '2026-08-04T10:30:00Z'
                    updatedAt: '2026-08-04T10:30:00Z'
                  meta:
                    requestId: 4b1c9d8e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
                    timestamp: '2026-08-04T10:31:00Z'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

  get:
    tags:
      - roles-admin
    summary: Список участников организации
    operationId: listMembers
    description: |-
      Возвращает участников организации с ролями и статусами.

      **Разрешение:** `membership.read.organization` (ORG_OWNER; CLUB_ADMIN видит только свой клуб).

      **Query:** пагинация (`page`, `pageSize`), фильтры `status`, `role`, поиск `q` по имени/телефону, `sort`.
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/MembershipStatusQuery'
      - $ref: '../components/parameters.yaml#/RoleQuery'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Page'
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Список участников.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../schemas/Membership.yaml'
                meta:
                  $ref: '../schemas/PageMeta.yaml'
            examples:
              members:
                $ref: '../components/examples.yaml#/MembersListExample'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'

'/organizations/{organizationId}/members/{userId}':
  get:
    tags:
      - roles-admin
    summary: Детали участника
    operationId: getMember
    description: |
      Полная информация об участнике: статус, роли, клубные scope, кто пригласил, история статуса.
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/MemberUserId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '200':
        description: Участник организации.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/Membership.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags:
      - roles-admin
    summary: Обновить участника (роли/статус)
    operationId: updateMember
    description: |-
      Обновляет статус и/или полный набор ролей участника.

      **Разрешение:** `membership.manage.organization` (ORG_OWNER).

      **Правила иерархии и безопасности:**
      - Нельзя изменять участника, чей наивысший уровень роли **>= собственного** (нет privilege escalation) → `403 ROLE_ASSIGNMENT_FORBIDDEN`.
      - Нельзя снять последнюю роль `ORG_OWNER` с последнего владельца организации → `409 LAST_OWNER_PROTECTION`.
      - `CLUB_ADMIN` требует минимум один клуб в scope → `422 INVALID_ROLE_SCOPE`.
      - `ORG_OWNER` — только передача роли от Owner существующему Admin; клубный scope для Owner не заполняется.
      - `status: SUSPENDED` приостанавливает доступ (membership без прав даже при наличии ролей); `ACTIVE` — восстановление.

      **Аудит:** каждое изменение ролей/статуса фиксируется в audit log (actor, tenant, before/after).
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/MemberUserId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/MemberUpdateRequest.yaml'
          examples:
            promoteToOwner:
              value:
                roles:
                  - code: ORG_OWNER
            suspendAdmin:
              value:
                status: SUSPENDED
    responses:
      '200':
        description: Участник обновлён.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/Membership.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'

  delete:
    tags:
      - roles-admin
    summary: Удалить участника
    operationId: removeMember
    description: |-
      Мягко удаляет (REVOKED) membership участника. Роли и клубные scope деактивируются; повторный invite возможен только явным новым приглашением.

      **Правила:**
      - Запрещено удалять участника с ролью >= своей (`403 ROLE_ASSIGNMENT_FORBIDDEN`).
      - Запрещено удалять последнего `ORG_OWNER` (`409 LAST_OWNER_PROTECTION`).
      - Удаление фиксируется в audit log; `reason` обязателен для аудита.

      **Идемпотентность:** повторный delete уже REVOKED membership возвращает 204.
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/MemberUserId'
      - $ref: '../components/parameters.yaml#/ReasonQuery'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    responses:
      '204':
        description: Участник удалён (membership REVOKED).
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'

'/organizations/{organizationId}/members/{userId}/club-scopes':
  put:
    tags:
      - roles-admin
    summary: Установить клубный scope админа
    operationId: setMemberClubScopes
    description: |-
      Заменяет список клубов, доступных `CLUB_ADMIN` (полный set, идемпотентно).

      **Правила:**
      - Применяется только к роли `CLUB_ADMIN` → иначе `422 INVALID_ROLE_SCOPE`.
      - Клубы должны принадлежать организации membership.
      - Не менее одного клуба (`minItems: 1`).
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/MemberUserId'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/ClubScopeUpdateRequest.yaml'
          examples:
            setScopes:
              value:
                clubIds:
                  - 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                  - 8d7e6f5a-4b3c-4d2e-9f1a-2b3c4d5e6f7a
    responses:
      '200':
        description: Клубный scope обновлён.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/Membership.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
