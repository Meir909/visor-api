      Самые популярные ресурсы за период: бронирования, занятые ресурсо-часы и выручка.

      - Разрешение `analytics.read.organization`; для `CLUB_ADMIN` обязателен `clubId`.
      - Источник — снапшоты `POPULAR_RESOURCES`; лимит топ-N через `limit` (по умолчанию 10, максимум 50).
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
