        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

'/organizations/{organizationId}/analytics/peak-hours':
  get:
    tags:
      - analytics
    summary: Пиковые часы организации
    operationId: getPeakHours
    description: |-
      Распределение загрузки по часам за период (в локальной таймзоне клуба). Помогает планировать смены и промоакции.

      - Разрешение `analytics.read.organization`; для `CLUB_ADMIN` обязателен `clubId`.
      - Источник — производная от `HOURLY_OCCUPANCY`; часы нормируются в `timezone` клуба.
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/AnalyticsFrom'
      - $ref: '../components/parameters.yaml#/AnalyticsTo'
      - $ref: '../components/parameters.yaml#/ClubIdQuery'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Пиковые часы.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/PeakHours.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              peakHours:
                $ref: '../components/examples.yaml#/PeakHoursExample'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'

'/organizations/{organizationId}/clubs/{clubId}/analytics/overview':
  get:
    tags:
      - analytics
    summary: Сводка дашборда клуба
    operationId: getClubAnalyticsOverview
    description: |-
      Сводные показатели одного клуба за период. Аналог `GET /analytics/overview`, но скоуп ограничен клубом.

      **Правила:**
      - `ORG_OWNER` видит все клубы организации; `CLUB_ADMIN` — только клубы из своего `clubIds`.
      - Клуб должен существовать в организации → иначе `404`.
    parameters:
      - $ref: '../components/parameters.yaml#/OrganizationId'
      - $ref: '../components/parameters.yaml#/ClubId'
      - $ref: '../components/parameters.yaml#/AnalyticsFrom'
      - $ref: '../components/parameters.yaml#/AnalyticsTo'
      - $ref: '../components/parameters.yaml#/CorrelationId'
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Сводка дашборда клуба.
        content:
          application/json:
            schema:
              type: object
              required: [data, meta]
              properties:
                data:
                  $ref: '../schemas/AnalyticsOverview.yaml'
                meta:
                  $ref: '../schemas/RequestMeta.yaml'
            examples:
              clubOverview:
                $ref: '../components/examples.yaml#/ClubAnalyticsOverviewExample'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
