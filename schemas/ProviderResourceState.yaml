type: string
description: |
  Каноническое состояние ресурса по данным Provider (проекция).
  Проекция может быть устаревшей — оценивайте freshness по полю `stateObservedAt`/`lastProviderStateAt`.
enum:
  - AVAILABLE
  - IN_USE
  - OFFLINE
  - MAINTENANCE
  - UNKNOWN
x-enum-descriptions:
  AVAILABLE: Ресурс свободен по данным Provider.
  IN_USE: Ресурс занят активной сессией.
  OFFLINE: Ресурс выключен/недоступен.
  MAINTENANCE: Ресурс в техническом режиме.
  UNKNOWN: Состояние неизвестно (не обновлялось). Никогда не трактуется как AVAILABLE.
