type: object
description: Верификация одноразового кода. Успех создаёт server-side session и пару токенов.
required:
  - challengeId
  - code
properties:
  challengeId:
    type: string
    format: uuid
    description: Идентификатор challenge из ответа на запрос OTP.
  code:
    type: string
    pattern: '^\d{4,6}$'
    minLength: 4
    maxLength: 6
    description: Одноразовый код.
    example: '481293'
  deviceId:
    type: string
    maxLength: 160
    description: Клиентский идентификатор устройства; привязывается к сессии.
  deviceName:
    type: string
    maxLength: 160
    description: Отображаемое имя устройства для списка сессий.
    example: Chrome on macOS
