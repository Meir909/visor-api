type: string
description: Тип правила тарификации.
enum:
  - BASE
  - HAPPY_HOUR
  - SURCHARGE
  - DYNAMIC
x-enum-descriptions:
  BASE: Базовый тариф (умолчание клуба/зоны/ресурса).
  HAPPY_HOUR: Скидочный/повышенный тариф в окне времени (например, счастливые часы).
  SURCHARGE: Наценка/доплата поверх базового тарифа.
  DYNAMIC: Динамический тариф (зарезервирован, будущая версия).