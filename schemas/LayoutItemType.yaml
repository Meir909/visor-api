  - VIP_ROOM
  - DECOR
x-enum-descriptions:
  COMPUTER: Компьютер; привязан к резервируемому ресурсу.
  VIP_ROOM: ВИП-комната; привязана к резервируемому ресурсу.
  DECOR: Декоративный элемент (стена, стойка, текст) без ресурса.
