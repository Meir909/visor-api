type: object
description: |
  Предпочтения уведомлений пользователя. Определяют, какие типы событий и по каким каналам доставляются. Настройка каналов/шаблонов принадлежит Visora, а не клиенту — здесь только пользовательские предпочтения.
required:
  - locale
  - inAppEnabled
  - rules
properties:
  locale:
    type: string
    description: Локаль пользователя для уведомлений.
    example: ru-RU
  inAppEnabled:
    type: boolean
    description: Глобально разрешены ли уведомления в приложении.
  rules:
    type: array
    description: Предпочтения по типам уведомлений.
    items:
      $ref: '../schemas/NotificationPreferenceRule.yaml'