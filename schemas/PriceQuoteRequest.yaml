type: object
description: |
  Запрос расчёта цены (quote) для будущей брони. Аналогичен по форме `ReservationCreateRequest`, но не создаёт бронь и не резервирует ресурсы. Результат доступен ограниченное время (expiresAt).
required:
  - clubId
  - resourceIds
  - startAt
  - endAt
properties:
  clubId:
    type: string
    format: uuid
  resourceIds:
    type: array
    minItems: 1
    maxItems: 10
    uniqueItems: true
    description: Ресурсы брони (один VIP room либо компьютеры одной зоны/клуба).
    items:
      type: string
      format: uuid
    example:
      - 3fa85f64-5717-4562-b3fc-2c963f66afa6
  startAt:
    type: string
    format: date-time
  endAt:
    type: string
    format: date-time
    description: Длительность в пределах min/max для применяемых правил.
  participantCount:
    type: integer
    minimum: 1
    default: 1
    description: Число участников (условие применимости правил).
  discountCode:
    type:
      - string
      - 'null'
    maxLength: 64
    description: 'Код промокода, если требуется учесть скидку в quote.'