type: object
description: |
  Запрос на создание бронирования.

  Валидация полей:
  - `clubId`, `resourceIds[*]` — UUID.
  - `startAt`, `endAt` — ISO 8601 (date-time); `endAt` строго позже `startAt`.
  - `resourceIds` — от 1 до 10 элементов, без дубликатов; либо один VIP room, либо от 1 до 10 компьютеров; смешивать типы запрещено.
  - `participantCount` — от 1 и не более суммарной вместимости ресурсов.
  - `notes` — до 1000 символов.
  - `discountCode` — до 64 символов.
required:
  - clubId
  - resourceIds
  - startAt
  - endAt
properties:
  clubId:
    type: string
    format: uuid
    description: Клуб, в котором создаётся бронь.
  resourceIds:
    type: array
    minItems: 1
    maxItems: 10
    uniqueItems: true
    description: Ресурсы брони (один VIP room либо компьютеры).
    items:
      type: string
      format: uuid
    example:
      - 3fa85f64-5717-4562-b3fc-2c963f66afa6
  startAt:
    type: string
    format: date-time
    description: Начало брони. Не ранее чем за 24 часа от текущего момента.
  endAt:
    type: string
    format: date-time
    description: Окончание брони. Длительность от минимальной (конфигурируемой) до 10 часов.
  participantCount:
    type: integer
    minimum: 1
    default: 1
    description: Число участников (не более суммарной вместимости ресурсов).
  notes:
    type: [string, 'null']
    maxLength: 1000
    description: Заметки.
  discountCode:
    type: [string, 'null']
    maxLength: 64
    description: Код промокода (если применим к клубу).
  source:
    $ref: './ReservationSource.yaml'
    default: PLAYER_WEB
