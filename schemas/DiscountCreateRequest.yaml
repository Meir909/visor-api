type: object
description: Создание промо/скидки клуба.
required:
  - name
  - discountType
  - validFrom
  - validUntil
properties:
  code:
    type: string
    description: Код купона (уникален в клубе). Без кода промо не применяется игроком вручную.
    maxLength: 64
    pattern: '^[A-Z0-9_-]+$'
    example: WELCOME10
  name:
    type: string
    maxLength: 160
    description: Название промо.
    example: Приветственный 10%
  description:
    type: string
    description: Описание для администратора.
    example: Скидка на первую бронь для новых игроков
  discountType:
    $ref: './DiscountType.yaml'
  amountMinor:
    type: string
    description: Фиксированная скидка в minor units. Обязателен при `FIXED_AMOUNT`.
    pattern: '^\d+$'
    example: '100000'
  percentageBasisPoints:
    type: integer
    minimum: 1
    maximum: 10000
    description: Скидка в базисных пунктах. Обязателен при `PERCENTAGE` (100 = 1%).
    example: 1000
  currency:
    type: string
    minLength: 3
    maxLength: 3
    pattern: '^[A-Z]{3}$'
    description: Валюта ISO 4217. Обязательна при `FIXED_AMOUNT`.
    example: KZT
  validFrom:
    type: string
    format: date-time
    description: Начало действия промо.
    example: '2026-08-05T00:00:00Z'
  validUntil:
    type: string
    format: date-time
    description: Окончание действия промо. Строго позже `validFrom`.
    example: '2026-09-05T00:00:00Z'
  totalRedemptionLimit:
    type: integer
    minimum: 1
    description: Глобальный лимит применений.
    example: 500
  perUserRedemptionLimit:
    type: integer
    minimum: 1
    description: Лимит применений на пользователя.
    example: 1
  minimumAmountMinor:
    type: string
    pattern: '^\d+$'
    description: Минимальная сумма брони для применения в minor units.
    example: '600000'
  maximumDiscountMinor:
    type: string
    pattern: '^\d+$'
    description: Потолок скидки в minor units.
    example: '150000'
