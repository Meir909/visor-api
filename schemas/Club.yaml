type: object
description: Полная карточка клуба (управляемый вид, CLUB_ADMIN/ORG_OWNER) с реквизитами и политикой бронирования.
required:
  - id
  - organizationId
  - name
  - slug
  - status
  - timezone
  - currency
  - addressLine
  - city
  - countryCode
  - defaultPriceMinor
  - reservationHorizonMinutes
  - arrivalGraceMinutes
  - cancellationCutoffMinutes
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    format: uuid
  organizationId:
    type: string
    format: uuid
    description: Владеющий tenant; неизменяем после активации.
  name:
    type: string
    maxLength: 160
    description: Публичное название клуба.
  slug:
    type: string
    maxLength: 120
    pattern: '^[a-z0-9](?:[a-z0-9-]{1,118}[a-z0-9])?$'
    description: URL-safe идентификатор, уникальный в пределах организации.
  description:
    type: [string, 'null']
    description: Публичное описание.
  status:
    $ref: './ClubStatus.yaml'
  timezone:
    type: string
    maxLength: 64
    description: IANA time zone клуба.
    example: Asia/Almaty
  currency:
    type: string
    maxLength: 3
    pattern: '^[A-Z]{3}$'
    description: Валюта цен клуба (ISO 4217).
    example: KZT
  phoneE164:
    type: [string, 'null']
    maxLength: 20
    pattern: '^\+[1-9]\d{1,14}$'
    description: Контактный телефон.
  addressLine:
    type: string
    maxLength: 300
    description: Отображаемый адрес.
    example: пр. Достык 36, ТРЦ Mega
  city:
    type: string
    maxLength: 120
    example: Алматы
  countryCode:
    type: string
    maxLength: 2
    pattern: '^[A-Z]{2}$'
    description: ISO 3166-1 alpha-2.
    example: KZ
  latitude:
    type: [number, 'null']
    minimum: -90
    maximum: 90
    description: Широта; задаётся вместе с longitude.
    example: 43.238293
  longitude:
    type: [number, 'null']
    minimum: -180
    maximum: 180
    description: Долгота.
    example: 76.945465
  defaultPriceMinor:
    type: string
    pattern: '^-?\d+$'
    description: Базовая почасовая цена в minor units (строка, чтобы не терять точность). Например `"120000"` = 1 200 ₸/час.
    example: '120000'
  reservationHorizonMinutes:
    type: integer
    minimum: 1
    description: Горизонт бронирования вперёд (MVP default 1 440 = 24 часа).
    example: 1440
  arrivalGraceMinutes:
    type: integer
    minimum: 1
    description: Grace-период неявки после начала (MVP default 10).
    example: 10
  cancellationCutoffMinutes:
    type: integer
    minimum: 1
    description: За сколько до начала можно отменить бронь без штрафа (MVP default 180).
    example: 180
  settings:
    type: object
    description: Клубные feature-флаги и конфигурация (jsonb).
    example:
      requireDepositForNewPlayers: true
  workingHours:
    type: array
    description: Недельное расписание (управляемый вид).
    items:
      $ref: './WorkingHoursEntry.yaml'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
