# Параметры путей, query, headers модуля Reservations.

ReservationId:
  name: reservationId
  in: path
  required: true
  description: Идентификатор бронирования (UUID).
  schema:
    type: string
    format: uuid
  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

ExtensionId:
  name: extensionId
  in: path
  required: true
  description: Идентификатор запроса на продление (UUID).
  schema:
    type: string
    format: uuid
  example: 7d8e9f0a-4a1b-4c2d-8e3f-5a6b7c8d9e0f

Page:
  name: page
  in: query
  required: false
  description: Номер страницы (начиная с 1).
  schema:
    type: integer
    minimum: 1
    default: 1
  example: 1

PageSize:
  name: pageSize
  in: query
  required: false
  description: Размер страницы.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  example: 20

Sort:
  name: sort
  in: query
  required: false
  description: |
    Сортировка в формате `поле:направление`.
    Допустимые поля: `startAt`, `endAt`, `createdAt`, `totalMinor`.
    Направление: `asc` или `desc`.
  schema:
    type: string
    pattern: '^(startAt|endAt|createdAt|totalMinor):(asc|desc)$'
    default: 'startAt:desc'
  example: 'startAt:desc'

Q:
  name: q
  in: query
  required: false
  description: Поиск по номеру брони, имени или телефону игрока.
  schema:
    type: string
    maxLength: 100
  example: 'VR-20260804'

From:
  name: from
  in: query
  required: false
  description: Начало интервала фильтрации (inclusive).
  schema:
    type: string
    format: date-time
  example: '2026-08-04T00:00:00Z'

To:
  name: to
  in: query
  required: false
  description: Конец интервала фильтрации (exclusive).
  schema:
    type: string
    format: date-time
  example: '2026-08-05T00:00:00Z'

StatusFilter:
  name: status
  in: query
  required: false
  description: |
    Фильтр по статусам бронирования. Можно указать несколько значений через запятую.
    Допустимые значения: `DRAFT`, `PENDING`, `CONFIRMED`, `CHECKED_IN`, `ACTIVE`, `COMPLETED`, `CANCELLED`, `EXPIRED`, `NO_SHOW`, `REJECTED`.
  style: form
  explode: false
  schema:
    type: array
    items:
      $ref: '../schemas/ReservationStatus.yaml'
  example:
    - CONFIRMED
    - CHECKED_IN

ClubIdQuery:
  name: clubId
  in: query
  required: false
  description: Идентификатор клуба (UUID). Обязателен для администратора с несколькими клубами.
  schema:
    type: string
    format: uuid
  example: 1c1308a1-4c0e-4d3b-9f2a-0a1b2c3d4e5f

PlayerId:
  name: playerId
  in: query
  required: false
  description: Идентификатор игрока (UUID). Только для CLUB_ADMIN/ORG_OWNER.
  schema:
    type: string
    format: uuid
  example: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d

ResourceId:
  name: resourceId
  in: query
  required: false
  description: Идентификатор ресурса (компьютера или VIP-комнаты, UUID).
  schema:
    type: string
    format: uuid
  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

ResourceTypeQuery:
  name: resourceType
  in: query
  required: false
  description: Тип ресурса.
  schema:
    $ref: '../schemas/ResourceType.yaml'

ZoneIds:
  name: zoneIds
  in: query
  required: false
  description: Список зон (UUID), разделённых запятой.
  schema:
    type: string
  example: 9d1f4e7a-2c3b-4a5e-8f6d-7a8b9c0d1e2f,1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d

IncludeState:
  name: includeState
  in: query
  required: false
  description: Включить последнее известное состояние ресурса от Provider и его freshness.
  schema:
    type: boolean
    default: false

AdminDate:
  name: date
  in: query
  required: false
  description: Дата очереди (локальная дата клуба, ISO 8601 `YYYY-MM-DD`). По умолчанию — сегодня.
  schema:
    type: string
    format: date
  example: '2026-08-04'

IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    Уникальный ключ операции (UUID).
    Повторный запрос с тем же ключом и тем же телом возвращает сохранённый результат.
    Тот же ключ с другим телом → `409 IDEMPOTENCY_KEY_REUSED`.
    Клиент хранит ключ до завершения операции или явной ошибки.
  schema:
    type: string
    format: uuid
  example: 9d1f4e7a-2c3b-4a5e-8f6d-7a8b9c0d1e2f

IdempotencyKeyOptional:
  name: Idempotency-Key
  in: header
  required: false
  description: Уникальный ключ операции (UUID) для безопасного повторения запроса.
  schema:
    type: string
    format: uuid
  example: 9d1f4e7a-2c3b-4a5e-8f6d-7a8b9c0d1e2f

IfMatch:
  name: If-Match
  in: header
  required: true
  description: |
    Текущая версия ресурса (значение поля `version` брони) для оптимистичной блокировки.
    Пример: `"7"`. При расхождении — `409 VERSION_CONFLICT`.
  schema:
    type: string
    example: '"7"'

CorrelationId:
  name: X-Correlation-Id
  in: header
  required: false
  description: Идентификатор корреляции запроса. Прокидывается в логи, трассировку и ответ ошибки.
  schema:
    type: string
    format: uuid
  example: 4b1c9d8e-2f3a-4b5c-8d6e-7f8a9b0c1d2e

SessionId:
  name: sessionId
  in: path
  required: true
  description: Идентификатор сессии аутентификации (UUID).
  schema:
    type: string
    format: uuid
  example: b4c1d9e8-3e2f-4a5b-8c6d-7e8f9a0b1c2d

DeviceIdHeader:
  name: X-Device-Id
  in: header
  required: false
  description: Клиентский идентификатор устройства. Используется для rate limiting и привязки сессии; должен совпадать с `deviceId` из тела запроса.
  schema:
    type: string
    maxLength: 160
  example: android-8f4a2c

SessionStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр сессий по состоянию.
  schema:
    type: string
    enum:
      - ACTIVE
      - REVOKED
  example: ACTIVE

OrganizationId:
  name: organizationId
  in: path
  required: true
  description: Идентификатор организации (tenant scope) (UUID).
  schema:
    type: string
    format: uuid
  example: 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f

MemberUserId:
  name: userId
  in: path
  required: true
  description: Идентификатор участника организации (UUID).
  schema:
    type: string
    format: uuid
  example: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d

InvitationId:
  name: invitationId
  in: path
  required: true
  description: Идентификатор приглашения (membership со статусом INVITED) (UUID).
  schema:
    type: string
    format: uuid
  example: e6f7a8b9-0c1d-4e2f-8a3b-4c5d6e7f8a9b

MembershipStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр участников по статусу membership.
  schema:
    type: string
    enum:
      - INVITED
      - ACTIVE
      - SUSPENDED
      - REVOKED
  example: ACTIVE

RoleQuery:
  name: role
  in: query
  required: false
  description: Фильтр участников по коду роли.
  schema:
    $ref: '../schemas/RoleCode.yaml'
  example: CLUB_ADMIN

ReasonQuery:
  name: reason
  in: query
  required: false
  description: Причина операции (например, удаления участника) для аудита.
  schema:
    type: string
    maxLength: 240
  example: Сотрудник уволен

SlugQuery:
  name: slug
  in: query
  required: true
  description: Slug для проверки доступности.
  schema:
    type: string
    maxLength: 100
    pattern: '^[a-z0-9](?:[a-z0-9-]{1,98}[a-z0-9])?$'
  example: caspian-esports

ClubId:
  name: clubId
  in: path
  required: true
  description: Идентификатор клуба (UUID).
  schema:
    type: string
    format: uuid
  example: 8d7e6f5a-4b3c-4d2e-9f1a-2b3c4d5e6f7a

ClosureId:
  name: closureId
  in: path
  required: true
  description: Идентификатор временного перекрытия расписания (UUID).
  schema:
    type: string
    format: uuid
  example: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f

ClubStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр клубов организации по статусу.
  schema:
    type: string
    enum:
      - DRAFT
      - ACTIVE
      - MAINTENANCE
      - CLOSED
  example: ACTIVE

ClosureTypeQuery:
  name: closureType
  in: query
  required: false
  description: Фильтр перекрытий по типу.
  schema:
    $ref: '../schemas/ClosureType.yaml'
  example: HOLIDAY

CityQuery:
  name: city
  in: query
  required: false
  description: Фильтр публичного каталога по городу.
  schema:
    type: string
    maxLength: 120
  example: Алматы

CountryCodeQuery:
  name: countryCode
  in: query
  required: false
  description: Фильтр публичного каталога по стране (ISO 3166-1 alpha-2).
  schema:
    type: string
    maxLength: 2
    pattern: '^[A-Z]{2}$'
  example: KZ

ComputerId:
  name: computerId
  in: path
  required: true
  description: Идентификатор компьютера (UUID).
  schema:
    type: string
    format: uuid
  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

ProviderConnectionId:
  name: connectionId
  in: path
  required: true
  description: Идентификатор подключения к Provider (UUID).
  schema:
    type: string
    format: uuid
  example: 5f4e3d2c-1b2a-4c3d-9e8f-0a1b2c3d4e5f

BindingId:
  name: bindingId
  in: path
  required: true
  description: Идентификатор привязки ресурса к Provider (UUID).
  schema:
    type: string
    format: uuid
  example: 6a5b4c3d-2e1f-4d5e-8f0a-1b2c3d4e5f6a

ProviderEventId:
  name: eventId
  in: path
  required: true
  description: Идентификатор события Provider (`provider_events.id`, UUID).
  schema:
    type: string
    format: uuid
  example: c2d3e4f5-6a7b-4c8d-9e0f-1a2b3c4d5e6f

ProviderSignature:
  name: X-Provider-Signature
  in: header
  required: true
  description: |
    Подпись тела запроса, вычисленная Provider с общим ключом (HMAC) или по webhook signing scheme. Валидация происходит до чтения тела; невалидная подпись = 401.
  schema:
    type: string
  example: t=1722776400,v1=8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c

ProviderEventStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр по статусу обработки события.
  schema:
    $ref: '../schemas/ProviderEventStatus.yaml'

ProviderEventTypeQuery:
  name: eventType
  in: query
  required: false
  description: Фильтр по типу события.
  schema:
    $ref: '../schemas/ProviderEventType.yaml'

ProviderEventReceivedFrom:
  name: receivedFrom
  in: query
  required: false
  description: Нижняя граница по времени приёмки (ISO8601).
  schema:
    type: string
    format: date-time

ProviderEventReceivedTo:
  name: receivedTo
  in: query
  required: false
  description: Верхняя граница по времени приёмки (ISO8601).
  schema:
    type: string
    format: date-time

NotificationId:
  name: notificationId
  in: path
  required: true
  description: Идентификатор уведомления (UUID).
  schema:
    type: string
    format: uuid
  example: c2d3e4f5-6a7b-4c8d-9e0f-1a2b3c4d5e6f

NotificationStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр по статусу уведомления.
  schema:
    $ref: '../schemas/NotificationStatus.yaml'

NotificationTypeQuery:
  name: notificationType
  in: query
  required: false
  description: Фильтр по типу уведомления.
  schema:
    $ref: '../schemas/NotificationType.yaml'

NotificationUnreadOnly:
  name: unreadOnly
  in: query
  required: false
  description: Фильтр «только непрочитанные».
  schema:
    type: boolean

PricingRuleId:
  name: ruleId
  in: path
  required: true
  description: Идентификатор правила тарификации (UUID).
  schema:
    type: string
    format: uuid
  example: e7f8a9b0-1c2d-4e3f-8a9b-0c1d2e3f4a5b

PricingRuleTypeQuery:
  name: ruleType
  in: query
  required: false
  description: Фильтр по типу правила.
  schema:
    $ref: '../schemas/PricingRuleType.yaml'

PricingRuleScopeQuery:
  name: scopeType
  in: query
  required: false
  description: Фильтр по области действия правила.
  schema:
    $ref: '../schemas/PricingRuleScope.yaml'

PricingRuleActiveQuery:
  name: isActive
  in: query
  required: false
  description: Фильтр по операционной активации.
  schema:
    type: boolean

ZoneQuery:
  name: zoneId
  in: query
  required: false
  description: Фильтр компьютеров по зоне (UUID).
  schema:
    type: string
    format: uuid
  example: 9d1f4e7a-2c3b-4a5e-8f6d-7a8b9c0d1e2f

ResourceStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр по операционному статусу ресурса.
  schema:
    $ref: '../schemas/ResourceStatus.yaml'
  example: ACTIVE

BindingStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр привязок по статусу.
  schema:
    $ref: '../schemas/BindingStatus.yaml'
  example: ACTIVE

ZoneId:
  name: zoneId
  in: path
  required: true
  description: Идентификатор зоны клуба (UUID).
  schema:
    type: string
    format: uuid
  example: 9d1f4e7a-2c3b-4a5e-8f6d-7a8b9c0d1e2f

LayoutId:
  name: layoutId
  in: path
  required: true
  description: Идентификатор версии планировки (UUID).
  schema:
    type: string
    format: uuid
  example: 7a8b9c0d-1e2f-4a3b-8c5d-6e7f8a9b0c1d

ZoneTypeQuery:
  name: type
  in: query
  required: false
  description: Фильтр зон по типу.
  schema:
    $ref: '../schemas/ZoneType.yaml'
  example: VIP

AnalyticsFrom:
  name: from
  in: query
  required: true
  description: Начало периода аналитики (inclusive), ISO 8601 UTC. Диапазон ограничен ретенцией агрегатов.
  schema:
    type: string
    format: date-time
  example: '2026-07-04T00:00:00Z'

AnalyticsTo:
  name: to
  in: query
  required: true
  description: Конец периода аналитики (exclusive), ISO 8601 UTC.
  schema:
    type: string
    format: date-time
  example: '2026-08-04T00:00:00Z'

Granularity:
  name: granularity
  in: query
  required: false
  description: Гранулярность агрегации серии. По умолчанию `DAY`.
  schema:
    $ref: '../schemas/Granularity.yaml'
    default: DAY
  example: DAY

AnalyticsLimit:
  name: limit
  in: query
  required: false
  description: Ограничение количества элементов (топ ресурсов). По умолчанию 10, максимум 50.
  schema:
    type: integer
    minimum: 1
    maximum: 50
    default: 10
  example: 10

DiscountId:
  name: discountId
  in: path
  required: true
  description: Идентификатор промо/скидки (UUID).
  schema:
    type: string
    format: uuid
  example: 6f7a8b9c-0d1e-4f2a-8b3c-4d5e6f7a8b9c

DiscountTypeQuery:
  name: type
  in: query
  required: false
  description: Фильтр промо по типу скидки.
  schema:
    $ref: '../schemas/DiscountType.yaml'
  example: PERCENTAGE

DiscountStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр промо по вычисляемому статусу.
  schema:
    $ref: '../schemas/DiscountStatus.yaml'
  example: ACTIVE

RedemptionStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр использований скидки по статусу.
  schema:
    $ref: '../schemas/RedemptionStatus.yaml'
  example: APPLIED

PlatformRoleQuery:
  name: roleCode
  in: query
  required: false
  description: Фильтр пользователей по платформенной роли.
  schema:
    $ref: '../schemas/PlatformRoleCode.yaml'
  example: SUPER_ADMIN

PlatformUserId:
  name: userId
  in: path
  required: true
  description: Идентификатор пользователя платформы (UUID).
  schema:
    type: string
    format: uuid
  example: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d

AssignmentId:
  name: assignmentId
  in: path
  required: true
  description: Идентификатор назначения платформенной роли (UUID).
  schema:
    type: string
    format: uuid
  example: b1c2d3e4-5f6a-4b7c-8d9e-0f1a2b3c4d5e

OrganizationStatusQuery:
  name: status
  in: query
  required: false
  description: Фильтр организаций по статусу.
  schema:
    $ref: '../schemas/OrganizationStatus.yaml'
  example: ACTIVE

OrganizationIdQuery:
  name: organizationId
  in: query
  required: false
  description: Фильтр аудит-лога по организации (cross-tenant поиск).
  schema:
    type: string
    format: uuid
  example: 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f

ActorUserIdQuery:
  name: actorUserId
  in: query
  required: false
  description: Фильтр аудит-лога по исполнителю.
  schema:
    type: string
    format: uuid
  example: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d

AuditActionQuery:
  name: action
  in: query
  required: false
  description: Фильтр аудит-лога по стабильному коду действия.
  schema:
    type: string
    maxLength: 80
  example: organization.suspend

AuditEntityTypeQuery:
  name: entityType
  in: query
  required: false
  description: Фильтр аудит-лога по типу затронутого объекта.
  schema:
    type: string
    maxLength: 80
  example: organization

AuditLogEntryId:
  name: id
  in: path
  required: true
  description: Идентификатор записи аудит-лога (UUID).
  schema:
    type: string
    format: uuid
  example: c2d3e4f5-6a7b-4c8d-9e0f-1a2b3c4d5e6f
