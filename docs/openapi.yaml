                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                extensionRequest:
                  $ref: '#/components/examples/ExtensionRequestExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
