                  value:
                    entries:
                      - dayOfWeek: 1
                        opensAtLocal: '10:00'
                        closesAtLocal: '02:00'
                        closesNextDay: true
                        isClosed: false
                      - dayOfWeek: 2
                        opensAtLocal: '10:00'
                        closesAtLocal: '02:00'
                        closesNextDay: true
                        isClosed: false
