        - bearerAuth: []
      x-permissions:
        - reservation.cancel.self
        - reservation.cancel.club
      x-business-rules:
        - Отмена игроком не позднее cutoff (по умолчанию за 3 часа).
        - Освобождение слота после отмены.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
