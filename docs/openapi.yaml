                        displayName: Aigerim
                        maskedPhone: +7 705 *** 12 34
                        status: ACTIVE
                      status: INVITED
                      roles:
                        - code: CLUB_ADMIN
                          clubIds:
                            - 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
                      invitedByUserId: 5a4b3c2d-1e2f-4a3b-8c7d-6e5f4a3b2c1d
                      invitedAt: '2026-08-04T10:30:00Z'
                      createdAt: '2026-08-04T10:30:00Z'
                      updatedAt: '2026-08-04T10:30:00Z'
                    meta:
                      requestId: 4b1c9d8e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
                      timestamp: '2026-08-04T10:31:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
