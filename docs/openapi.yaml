  /auth/otp/request:
    post:
      tags:
        - auth
      summary: Запросить OTP-код
      operationId: requestOtp
      description: |-
        Отправляет одноразовый код (OTP) на номер телефона. Основной login identifier MVP — телефон в формате E.164.

        **Безопасность OTP:**
        - Код действует **5 минут**, challenge одноразовый.
        - Максимум **5 попыток** на challenge.
        - Интервал повторной отправки — **не менее 60 секунд**.
        - Лимиты на телефон, IP и device fingerprint (`429 OTP_RATE_LIMITED`).
        - OTP хранится как HMAC/hash, не plaintext.
        - Ответ **не раскрывает**, существует ли пользователь и активна ли его учётка: даже для BLOCKED/DEACTIVATED возвращается 200 с challengeId, но SMS не отправляется.
        - Статический код (`devStaticCode`) возвращается только в non-production среде.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceIdHeader'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            examples:
              requestOtp:
                $ref: '#/components/examples/OtpRequestExample'
      responses:
        '200':
          description: Код отправлен. Поле `retryAfterSeconds` задаёт минимальный интервал до повторного запроса.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/OtpChallenge'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                otpChallenge:
                  $ref: '#/components/examples/OtpChallengeExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/otp/verify:
    post:
      tags:
        - auth
      summary: Верифицировать OTP-код и войти
      operationId: verifyOtp
      description: |-
        Атомарно проверяет и «потребляет» одноразовый код. При успехе находит или создаёт пользователя (`findOrCreateUser(phone)`) и создаёт server-side session с парой токенов.

        **Токены:**
        - `accessToken` — JWT 10–15 минут, claim-ы: `sub`, `sid`, `iat`, `exp`, `iss`, `aud`.
        - `refreshToken` — случайный opaque токен, на сервере хранится только hash; срок 30 дней, rotation при каждом refresh.

        **Доставка refresh token:**
        - Web: только в `Set-Cookie` (HttpOnly, Secure, SameSite=Lax); в теле `refreshToken` отсутствует.
        - Mobile: в теле ответа; клиент хранит в OS secure storage.

        **Идемпотентность:** повторный verify с тем же `challengeId` невозможен (challenge одноразовый).
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            examples:
              verifyOtp:
                $ref: '#/components/examples/OtpVerifyRequestExample'
      responses:
        '200':
          description: Аутентификация успешна. Для web в заголовках ответа дополнительно устанавливается refresh cookie.
          headers:
            Set-Cookie:
              description: Refresh token cookie (web). HttpOnly, Secure, SameSite=Lax; `refresh_token=<value>; Path=/api/v1/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax`.
              schema:
                type: string
              example: refresh_token=v1.refresh.9f8e7d6c-5b4a-4c3d-8e2f-1a0b9c8d7e6f; Path=/api/v1/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                verifyOtp:
                  $ref: '#/components/examples/OtpVerifyResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Обновить пару токенов
      operationId: refreshSession
      description: |-
        Выполняет ротацию refresh token: старый атомарно помечается использованным и выдаётся новый.

        **Replay protection:**
        - Повторное использование старого токена считается replay attack → вся token family отзывается (`409 REFRESH_TOKEN_REPLAY`) и создаётся security event.
        - Срок жизни refresh token — 30 дней; `expires_at > created_at`.
        - Пользователь с `status = BLOCKED` или `DEACTIVATED` не получает новый токен (`422 USER_BLOCKED` / `USER_DEACTIVATED`).

        **Источник refresh token:** cookie `refresh_token` (web) либо поле `refreshToken` в теле (mobile).
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token для mobile-клиентов. Для web передаётся в cookie и это поле не заполняется.
        description: Опционально для mobile; для web токен берётся из HttpOnly cookie.
      responses:
        '200':
          description: Новая пара токенов. Refresh cookie (web) обновляется в заголовке `Set-Cookie`.
          headers:
            Set-Cookie:
              description: Обновлённый refresh token cookie (web).
              schema:
                type: string
              example: refresh_token=v1.refresh.0e9f8a7b-6c5d-4e3f-8a2b-1c0d9e8f7a6b; Path=/api/v1/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                refresh:
                  $ref: '#/components/examples/OtpVerifyResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/logout:
    post:
      tags:
        - auth
      summary: Выйти из текущей сессии
      operationId: logout
      description: |-
        Отзывает текущую refresh-сессию. Access token продолжает действовать до истечения TTL (10–15 минут) — это ограничение компенсируется коротким сроком жизни.

        Для web refresh token берётся из cookie; для mobile — из поля `refreshToken` в теле. Операция аудируется.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token для mobile-клиентов.
        description: Опционально для mobile; для web токен берётся из HttpOnly cookie.
      responses:
        '204':
          description: Сессия отозвана. Для web сервер также удаляет refresh cookie (`Max-Age=0`).
          headers:
            Set-Cookie:
              description: Очищенная refresh cookie (web).
              schema:
                type: string
              example: refresh_token=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Lax
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/logout-all:
    post:
      tags:
        - auth
      summary: Выйти со всех устройств
      operationId: logoutAll
      description: |
        Отзывает **все** активные refresh-сессии пользователя, включая текущую. Применяется при компрометации устройства. Создаётся security event.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Все сессии отозваны.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions:
    get:
      tags:
        - auth
      summary: Список активных сессий
      operationId: listSessions
      description: |
        Возвращает сессии текущего пользователя с пометкой `isCurrent`. Позволяет управлять устройствами из UI.

        Пагинация: `page`, `pageSize` (по умолчанию 1 и 20, максимум 100).
      parameters:
        - $ref: '#/components/parameters/SessionStatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Список сессий.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
              examples:
                sessions:
                  $ref: '#/components/examples/AuthSessionsExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sessions/{sessionId}/revoke:
    post:
      tags:
        - auth
      summary: Отозвать сессию
      operationId: revokeSession
      description: |
        Отзывает конкретную сессию пользователя (например, потерянное устройство). Отзыв собственной текущей сессии допустим.

        Повторный отзыв идемпотентен: сессия в статусе revoked возвращает 204.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
        description: Опциональная причина для аудита.
      responses:
        '204':
          description: Сессия отозвана.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/me:
    get:
      tags:
        - auth
      summary: Текущий пользователь
      operationId: getCurrentUser
      description: |
        Возвращает публичный профиль пользователя, аутентифицированного access token'ом.

        При `status = DEACTIVATED` профиль недоступен (`401`/`422 USER_DEACTIVATED`). Профиль и membership не кешируются в токене — API всегда резолвит их из базы/short-lived кеша.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Профиль текущего пользователя.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
              examples:
                me:
                  $ref: '#/components/examples/UserExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Короткоживущий JWT access token (10–15 минут).

        Заголовок: `Authorization: Bearer <token>`.

        Refresh token хранится в HttpOnly Secure cookie и обновляется через `POST /api/v1/auth/refresh` (модуль Auth).
        Члены организации получают membership и scope клуба из авторизованного контекста на сервере.
  schemas:
    Money:
      type: object
      description: Денежная сумма в минимальных единицах валюты (minor units).
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: string
          description: Целое число минимальных единиц валюты, сериализованное строкой (bigint). Без дробной части.
          pattern: ^-?\d+$
          example: '300000'
        currency:
          type: string
          description: Код валюты ISO 4217.
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          example: KZT
    ProblemDetails:
      type: object
      description: |
        Структура ошибки, совместимая с RFC 9457 (Problem Details).
        Frontend принимает решения по полю `code`, а не парсит `detail`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: URI документации проблемы.
          example: https://docs.visora.kz/problems/reservation-slot-conflict
        title:
          type: string
          description: Краткий человекочитаемый заголовок проблемы.
          example: Бронирование конфликтует с существующим
        status:
          type: integer
          description: HTTP-статус ответа.
          minimum: 100
          maximum: 599
          example: 409
        detail:
          type: string
          description: Детальное описание проблемы.
        instance:
          type: string
          format: uri-reference
          description: Конкретное вхождение (обычно путь запроса).
          example: /api/v1/reservations
        code:
          type: string
          description: Машиночитаемый код ошибки (см. схему ErrorCode).
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
          format: uuid
          description: Идентификатор корреляции для трассировки.
        errors:
          type: array
          description: Детали ошибок валидации по полям.
          items:
            type: object
            properties:
              field:
                type: string
                description: Путь к полю (например `resourceIds`).
              code:
                type: string
                description: Код ошибки поля.
              message:
                type: string
                description: Описание ошибки.
    ErrorCode:
      type: string
      description: Машиночитаемый код ошибки. Frontend принимает решения по этому полю.
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - RESERVATION_NOT_FOUND
        - RESERVATION_SLOT_CONFLICT
        - COMPUTER_ALREADY_RESERVED
        - VIP_ROOM_OCCUPIED
        - RESERVATION_EXPIRED
        - RESERVATION_ALREADY_ACTIVE
        - PLAYER_ALREADY_CHECKED_IN
        - EXTENSION_NOT_ALLOWED
        - CANCELLATION_NOT_ALLOWED
        - INVALID_STATE_TRANSITION
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - CLUB_CLOSED
        - MAXIMUM_DURATION_EXCEEDED
        - BOOKING_HORIZON_EXCEEDED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - OTP_INVALID_CODE
        - OTP_EXPIRED
        - OTP_ATTEMPTS_EXCEEDED
        - OTP_RATE_LIMITED
        - OTP_RESEND_TOO_SOON
        - INVALID_REFRESH_TOKEN
        - REFRESH_TOKEN_REPLAY
        - SESSION_NOT_FOUND
        - USER_BLOCKED
        - USER_DEACTIVATED
        - ORGANIZATION_NOT_FOUND
        - MEMBER_NOT_FOUND
        - MEMBERSHIP_NOT_FOUND
        - INVITATION_NOT_FOUND
        - ROLE_NOT_FOUND
        - ROLE_ASSIGNMENT_FORBIDDEN
        - LAST_OWNER_PROTECTION
        - MEMBER_ALREADY_EXISTS
        - MEMBERSHIP_SUSPENDED
        - MEMBERSHIP_REVOKED
        - INVALID_ROLE_SCOPE
        - ORGANIZATION_SLUG_TAKEN
        - ORGANIZATION_SUSPENDED
        - ORGANIZATION_CLOSED
        - INVALID_SLUG
        - CLUB_NOT_FOUND
        - CLUB_SLUG_TAKEN
        - CLUB_NOT_PUBLISHED
        - CLUB_MAINTENANCE
        - CLUB_HAS_ACTIVE_RESERVATIONS
        - WORKING_HOURS_OVERLAP
        - INVALID_WORKING_HOURS
        - CLOSURE_NOT_FOUND
        - CLOSURE_CONFLICT
        - COMPUTER_NOT_FOUND
        - COMPUTER_NUMBER_TAKEN
        - COMPUTER_MAINTENANCE
        - COMPUTER_DISABLED
        - COMPUTER_HAS_ACTIVE_RESERVATIONS
        - ZONE_NOT_FOUND
        - RESOURCE_NOT_FOUND
        - PROVIDER_CONNECTION_NOT_FOUND
        - PROVIDER_CONNECTION_DISABLED
        - PROVIDER_HEALTH_CHECK_FAILED
        - BINDING_NOT_FOUND
        - BINDING_ALREADY_EXISTS
        - RESOURCE_ALREADY_BOUND
        - LAYOUT_NOT_FOUND
        - LAYOUT_NOT_PUBLISHED
        - LAYOUT_IS_PUBLISHED
        - LAYOUT_ALREADY_PUBLISHED
        - LAYOUT_VALIDATION_FAILED
        - LAYOUT_RESOURCE_NOT_FOUND
