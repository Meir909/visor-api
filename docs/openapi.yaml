  /reservations/{reservationId}/extensions:
    post:
      tags:
        - reservations
      summary: Запросить продление брони
      operationId: requestReservationExtension
      description: |-
        Создаёт запрос на продление брони. Запрос не меняет бронь до утверждения администратором.

        **Правила:**
        - `requestedEndAt` строго позже текущего `endAt`.
        - Суммарная длительность не более 10 часов.
        - Бронь должна быть в статусе `CHECKED_IN` или `ACTIVE` → иначе `422 EXTENSION_NOT_ALLOWED`.
        - На новый интервал не должно быть пересечений → `409 RESERVATION_SLOT_CONFLICT`.

        **Разрешение:** `reservation.extend.self`.
      security:
        - bearerAuth: []
      x-permissions:
        - reservation.extend.self
      x-business-rules:
        - Продление утверждает администратор.
        - Запрос не меняет бронь до решения.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationExtensionRequestCreate'
            examples:
              extend:
                value:
                  requestedEndAt: '2026-08-04T19:00:00Z'
                  reason: Хочу поиграть ещё
      responses:
        '201':
          description: Запрос на продление создан.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
