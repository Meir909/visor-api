          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderResourceBinding'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
              examples:
                bindings:
                  $ref: '#/components/examples/BindingsExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
