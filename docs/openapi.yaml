      description: Создание новой черновой версии планировки. Начинается с пустого канваса; при создании из опубликованной версии можно скопировать её объекты (копирование на клиенте).
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 160
          example: Карта после ремонта
        canvasWidth:
          type: integer
          minimum: 1
          default: 1200
        canvasHeight:
          type: integer
          minimum: 1
          default: 800
    ClubLayoutUpdateRequest:
      type: object
      description: Обновление черновой версии планировки. `objects` заменяет документ целиком (полная замена layout_data). Published версия не редактируется.
      properties:
        name:
          type: string
          maxLength: 160
        canvasWidth:
          type: integer
          minimum: 1
        canvasHeight:
          type: integer
          minimum: 1
        objects:
          type: array
          description: Полный набор объектов канваса (замена).
          items:
            $ref: '#/components/schemas/LayoutItem'
    LayoutValidation:
      type: object
      description: Результат валидации планировки (dry-run перед публикацией).
      required:
        - valid
        - checkedAt
      properties:
        valid:
          type: boolean
          description: Проходит ли планировка проверки публикации.
        version:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Проверенная версия.
        issues:
          type: array
          description: Проблемы, блокирующие публикацию.
          items:
            type: object
            required:
              - code
            properties:
              code:
                type: string
                description: Машиночитаемый код проблемы.
                example: LAYOUT_RESOURCE_NOT_FOUND
              itemId:
                type:
                  - string
                  - 'null'
                maxLength: 100
                description: Объект канваса, к которому относится проблема.
              message:
                type: string
                description: Человеко-понятное описание.
        checkedAt:
          type: string
          format: date-time
    Zone:
      type: object
      description: Зона клуба — логическая область для группировки, доступности, отображения на карте и ценообразования.
      required:
        - id
        - clubId
        - code
        - name
        - type
        - displayOrder
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 50
          description: Стабильный код, уникальный в пределах клуба (case-insensitive).
          example: vip-2
        name:
          type: string
          maxLength: 120
          example: VIP Zone 2
        type:
          $ref: '#/components/schemas/ZoneType'
        displayOrder:
          type: integer
          minimum: 0
          description: Порядок отображения в UI.
          example: 2
        isActive:
          type: boolean
          description: Операционная видимость.
          default: true
        computerCount:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Число активных компьютеров в зоне (агрегат).
        metadata:
          type: object
          description: Не-критические расширения (jsonb).
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ZoneCreateRequest:
      type: object
      description: Создание зоны клуба.
      required:
        - code
        - name
        - type
      properties:
        code:
          type: string
          maxLength: 50
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,48}[a-z0-9])?$
          description: Стабильный код; занят в клубе = `409 ZONE_CODE_TAKEN`.
          example: vip-2
        name:
          type: string
          maxLength: 120
          example: VIP Zone 2
        type:
          $ref: '#/components/schemas/ZoneType'
        displayOrder:
          type: integer
          minimum: 0
          default: 0
        metadata:
          type: object
          description: Не-критические расширения.
          additionalProperties: true
    ZoneUpdateRequest:
      type: object
      description: 'Обновление зоны клуба. `isActive: false` скрывает зону из публичной карты; компьютеры остаются, но в пассивной зоне не показываются.'
      properties:
        name:
          type: string
          maxLength: 120
        displayOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        metadata:
          type: object
          description: Deep merge не-критических расширений.
          additionalProperties: true
    Granularity:
      type: string
      description: Гранулярность агрегации аналитики.
      enum:
        - HOUR
        - DAY
        - WEEK
    AnalyticsSnapshotType:
      type: string
      description: Тип аналитического снапшота (см. таблицу `analytics_snapshots`).
      enum:
        - DAILY_REVENUE
        - HOURLY_OCCUPANCY
        - CONVERSION
        - POPULAR_RESOURCES
        - PEAK_HOURS
    AnalyticsPeriod:
      type: object
      description: Период аналитики (полуоткрытый `[from, to)`).
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
          description: Начало периода (inclusive), UTC.
          example: '2026-07-01T00:00:00Z'
        to:
          type: string
          format: date-time
          description: Конец периода (exclusive), UTC.
          example: '2026-08-01T00:00:00Z'
    AnalyticsSource:
      type: object
      description: Метаданные проекции агрегатов, по которой построен ответ.
      required:
        - snapshotType
        - granularity
        - sourceWatermark
        - calculationVersion
      properties:
        snapshotType:
          $ref: '#/components/schemas/AnalyticsSnapshotType'
        granularity:
          $ref: '#/components/schemas/Granularity'
        sourceWatermark:
          type: string
          format: date-time
          description: Верхняя граница исходных данных, включённых в агрегат (watermark).
          example: '2026-08-03T23:59:59Z'
        calculationVersion:
          type: integer
          minimum: 1
          description: Версия проектора/схемы агрегации.
          example: 1
        expiresAt:
          type: string
          format: date-time
          description: Ретенция снапшота (по умолчанию 31 день).
          example: '2026-09-03T00:00:00Z'
    RevenuePoint:
      type: object
      description: Точка серии выручки за бакет времени.
      required:
        - periodStart
        - periodEnd
        - revenue
        - bookings
        - avgCheck
      properties:
        periodStart:
          type: string
          format: date-time
          description: Начало бакета (inclusive).
          example: '2026-07-31T00:00:00Z'
        periodEnd:
          type: string
          format: date-time
          description: Конец бакета (exclusive).
          example: '2026-08-01T00:00:00Z'
        revenue:
          type: string
          description: Выручка за бакет в minor units валюты (строка без плавающей точки).
          example: '1250000'
        refunds:
          type: string
          description: Возвраты за бакет в minor units.
          example: '85000'
        bookings:
          type: integer
          description: Количество завершённых бронирований в бакете.
          example: 42
        cancelledBookings:
          type: integer
          description: Количество отменённых бронирований.
          example: 3
        avgCheck:
          type: string
          description: Средний чек в minor units.
          example: '29761'
    RevenueSeries:
      type: object
      description: Серия выручки по бакетам времени.
      required:
        - granularity
        - currency
        - source
        - points
      properties:
        granularity:
          $ref: '#/components/schemas/Granularity'
        currency:
          type: string
          description: Валюта расчётов (ISO 4217).
          example: KZT
        source:
          $ref: '#/components/schemas/AnalyticsSource'
        points:
          type: array
          description: Точки серии, упорядоченные по `periodStart`.
          items:
            $ref: '#/components/schemas/RevenuePoint'
    OccupancyPoint:
      type: object
      description: Точка серии загрузки за бакет времени.
      required:
        - periodStart
        - periodEnd
        - occupiedHours
        - availableHours
        - totalHours
        - occupancyRate
        - resourcesTotal
      properties:
        periodStart:
          type: string
          format: date-time
          description: Начало бакета (inclusive).
          example: '2026-07-31T00:00:00Z'
        periodEnd:
          type: string
          format: date-time
          description: Конец бакета (exclusive).
          example: '2026-08-01T00:00:00Z'
        occupiedHours:
          type: number
          format: double
          description: Занятые ресурсо-часы за бакет.
          example: 182.5
        availableHours:
          type: number
          format: double
          description: Свободные ресурсо-часы за бакет.
          example: 250
        totalHours:
          type: number
          format: double
          description: Суммарные ресурсо-часы (занятые + свободные).
          example: 432.5
        occupancyRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Доля занятых ресурсо-часов (0..1).
          example: 0.42
        resourcesInUse:
          type: integer
          description: Среднее число ресурсов, занятых в бакете.
          example: 9
        resourcesTotal:
          type: integer
          description: Среднее число активных ресурсов в периоде.
          example: 24
    OccupancySeries:
      type: object
      description: Серия загрузки по бакетам времени.
      required:
        - granularity
        - source
        - points
      properties:
        granularity:
          $ref: '#/components/schemas/Granularity'
        source:
          $ref: '#/components/schemas/AnalyticsSource'
        points:
          type: array
          description: Точки серии, упорядоченные по `periodStart`.
          items:
            $ref: '#/components/schemas/OccupancyPoint'
    ConversionFunnel:
      type: object
      description: Воронка конверсии бронирований за период.
      required:
        - period
        - stages
        - conversionRate
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        stages:
          type: object
          description: Количество бронирований на каждом этапе жизненного цикла.
          required:
            - created
            - confirmed
            - checkedIn
            - completed
            - cancelled
            - noShow
          properties:
            created:
              type: integer
              description: Созданные бронирования (включая DRAFT/PENDING).
              example: 1000
            confirmed:
              type: integer
              description: Подтверждённые.
              example: 620
            checkedIn:
              type: integer
              description: Прибывшие (check-in).
              example: 340
            completed:
              type: integer
              description: Завершённые (completed/active → completed).
              example: 305
            cancelled:
              type: integer
              description: Отменённые.
              example: 180
            noShow:
              type: integer
              description: Не пришедшие (no-show).
              example: 60
            expired:
              type: integer
              description: Истёкшие (hold timeout).
              example: 40
        conversionRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Доля бронирований, доведённых до check-in (`checkedIn / created`).
          example: 0.34
    PopularResource:
      type: object
      description: Ресурс в топе популярности за период.
      required:
        - rank
        - resourceId
        - name
        - bookings
        - occupiedHours
        - revenue
      properties:
        rank:
          type: integer
          minimum: 1
          description: Позиция в топе (1 — самый популярный).
          example: 1
        resourceId:
          type: string
          format: uuid
          description: Стабильный идентификатор ресурса (компьютер/VIP).
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          description: Отображаемое имя ресурса (например `PC 12`).
          example: PC 12
        zoneId:
          type:
            - string
            - 'null'
          format: uuid
          description: Зона ресурса или null.
          example: 9d1f4e7a-2c3b-4a5e-8f6d-7a8b9c0d1e2f
        zoneName:
          type:
            - string
            - 'null'
          description: Имя зоны ресурса или null.
          example: VIP Zone 2
        bookings:
          type: integer
          description: Количество бронирований ресурса за период.
          example: 87
        occupiedHours:
          type: number
          format: double
          description: Занятые ресурсо-часы за период.
          example: 312.5
        revenue:
          type: string
          description: Выручка ресурса за период в minor units валюты.
          example: '4217500'
        occupancyRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Доля занятых ресурсо-часов (0..1).
          example: 0.81
    PopularResources:
      type: object
      description: Топ популярных ресурсов за период.
      required:
        - source
        - items
      properties:
        source:
          $ref: '#/components/schemas/AnalyticsSource'
        items:
          type: array
          description: Ресурсы, упорядоченные по популярности (rank 1..N).
          items:
            $ref: '#/components/schemas/PopularResource'
    PeakHour:
      type: object
      description: Часовой срез для анализа пиковых часов.
      required:
        - hour
        - occupancyRate
        - bookings
      properties:
        hour:
          type: string
          pattern: ^\d{2}:00$
          description: Час в формате `HH:00` в локальной таймзоне клуба.
          example: '20:00'
        occupancyRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Средняя загрузка в этот час (0..1).
          example: 0.87
        bookings:
          type: integer
          description: Количество бронирований, начинающихся в этот час.
          example: 64
        shareOfOccupancy:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Доля часа в суммарной загрузке периода (0..1).
          example: 0.18
    PeakHours:
      type: object
      description: Распределение загрузки по часам за период.
      required:
        - timezone
        - source
        - items
      properties:
        timezone:
          type: string
          description: IANA-таймзона, в которой нормируются часы.
          example: Asia/Almaty
        source:
          $ref: '#/components/schemas/AnalyticsSource'
        items:
          type: array
          description: Часовые срезы, упорядоченные по `hour`.
          items:
            $ref: '#/components/schemas/PeakHour'
    AnalyticsOverview:
      type: object
      description: Сводка дашборда организации или клуба за период.
      required:
        - period
        - source
        - revenue
        - occupancy
        - bookings
        - conversion
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        source:
          $ref: '#/components/schemas/AnalyticsSource'
        revenue:
          type: object
          description: Итоги выручки.
          required:
            - total
            - bookings
            - avgCheck
          properties:
            total:
              type: string
              description: Суммарная выручка в minor units валюты.
              example: '1250000'
            bookings:
              type: integer
              description: Количество завершённых бронирований.
              example: 42
            avgCheck:
              type: string
              description: Средний чек в minor units.
              example: '29761'
        occupancy:
          type: object
          description: Итоги загрузки.
          required:
            - occupancyRate
            - occupiedHours
            - resourcesTotal
          properties:
            occupancyRate:
              type: number
              format: double
              minimum: 0
              maximum: 1
              description: Средняя загрузка за период (0..1).
              example: 0.42
            occupiedHours:
              type: number
              format: double
              description: Занятые ресурсо-часы за период.
              example: 5210
            resourcesTotal:
              type: integer
              description: Среднее число активных ресурсов.
              example: 24
        bookings:
          type: object
          description: Итоги по бронированиям.
          required:
            - created
            - checkedIn
            - cancelled
            - noShow
          properties:
            created:
              type: integer
              example: 1000
            confirmed:
              type: integer
              example: 620
            checkedIn:
              type: integer
              example: 340
            cancelled:
              type: integer
              example: 180
            noShow:
              type: integer
              example: 60
        conversion:
          type: object
          description: Воронка и конверсия.
          required:
            - conversionRate
          properties:
            conversionRate:
              type: number
              format: double
              minimum: 0
              maximum: 1
              description: Доля бронирований, доведённых до check-in.
              example: 0.34
            funnel:
              $ref: '#/components/schemas/ConversionFunnel'
        topResource:
          description: Самый популярный ресурс периода (null, если данных нет).
          allOf:
            - $ref: '#/components/schemas/PopularResource'
          example:
            rank: 1
            resourceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            name: PC 12
            zoneId: 9d1f4e7a-2c3b-4a5e-8f6d-7a8b9c0d1e2f
            zoneName: VIP Zone 2
            bookings: 87
            occupiedHours: 312.5
            revenue: '4217500'
            occupancyRate: 0.81
        activeClubs:
          type: integer
          minimum: 0
          description: Число активных клубов, включённых в сводку.
          example: 2
    DiscountType:
      type: string
      description: Тип скидочного механизма промо.
      enum:
        - PERCENTAGE
        - FIXED_AMOUNT
    DiscountStatus:
      type: string
      description: Вычисляемый операционный статус промо. Производный от `isActive` и периода `validFrom`/`validUntil`.
      enum:
        - SCHEDULED
        - ACTIVE
        - EXPIRED
        - INACTIVE
    Discount:
      type: object
      description: Промо/скидка клуба. Отдельно от базовых правил ценообразования.
      required:
        - id
        - organizationId
        - clubId
        - name
        - discountType
        - validFrom
        - validUntil
        - isActive
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор промо.
          example: 6f7a8b9c-0d1e-4f2a-8b3c-4d5e6f7a8b9c
        organizationId:
          type: string
          format: uuid
          description: Tenant организации.
          example: 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
        clubId:
          type: string
          format: uuid
          description: Клуб, к которому относится промо.
          example: 8d7e6f5a-4b3c-4d2e-9f1a-2b3c4d5e6f7a
        code:
          type:
            - string
            - 'null'
          description: Код купона для применения игроком (уникален в клубе) или null.
          maxLength: 64
          example: WELCOME10
        name:
          type: string
          maxLength: 160
          description: Название промо.
          example: Приветственный 10%
        description:
          type:
            - string
            - 'null'
          description: Описание для администратора.
          example: Скидка на первую бронь для новых игроков
        discountType:
          $ref: '#/components/schemas/DiscountType'
        amountMinor:
          type:
            - string
            - 'null'
          description: Фиксированная скидка в minor units (для `FIXED_AMOUNT`).
          example: '100000'
        percentageBasisPoints:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 10000
          description: Скидка в базисных пунктах (для `PERCENTAGE`), 100 = 1%.
          example: 1000
        currency:
          type:
            - string
            - 'null'
          description: Валюта ISO 4217 (обязательна для фиксированной скидки).
          example: KZT
        validFrom:
          type: string
          format: date-time
          description: Начало действия промо.
          example: '2026-08-05T00:00:00Z'
        validUntil:
          type: string
          format: date-time
          description: Окончание действия промо (exclusive).
          example: '2026-09-05T00:00:00Z'
        totalRedemptionLimit:
          type:
            - integer
            - 'null'
          description: Глобальный лимит применений или null.
          example: 500
        perUserRedemptionLimit:
          type:
            - integer
            - 'null'
          description: Лимит применений на пользователя или null.
          example: 1
        minimumAmountMinor:
          type:
            - string
            - 'null'
          description: Минимальная сумма брони для применения в minor units.
          example: '600000'
        maximumDiscountMinor:
          type:
            - string
            - 'null'
          description: Потолок скидки в minor units (для процентов).
          example: '150000'
        isActive:
          type: boolean
          description: Операционное состояние (вкл/выкл вручную).
          example: true
        status:
          $ref: '#/components/schemas/DiscountStatus'
        usedRedemptions:
          type: integer
          description: Текущее число использований (для контроля лимитов).
          example: 87
        createdAt:
          type: string
          format: date-time
          description: Время создания.
          example: '2026-07-05T08:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления.
          example: '2026-08-04T10:40:00Z'
    DiscountCreateRequest:
      type: object
      description: Создание промо/скидки клуба.
      required:
        - name
        - discountType
        - validFrom
        - validUntil
      properties:
        code:
          type: string
          description: Код купона (уникален в клубе). Без кода промо не применяется игроком вручную.
          maxLength: 64
          pattern: ^[A-Z0-9_-]+$
          example: WELCOME10
        name:
          type: string
          maxLength: 160
          description: Название промо.
          example: Приветственный 10%
        description:
          type: string
