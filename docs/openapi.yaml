        **Правила:**
        - Запрещено удалять участника с ролью >= своей (`403 ROLE_ASSIGNMENT_FORBIDDEN`).
        - Запрещено удалять последнего `ORG_OWNER` (`409 LAST_OWNER_PROTECTION`).
        - Удаление фиксируется в audit log; `reason` обязателен для аудита.

        **Идемпотентность:** повторный delete уже REVOKED membership возвращает 204.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MemberUserId'
        - $ref: '#/components/parameters/ReasonQuery'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Участник удалён (membership REVOKED).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
