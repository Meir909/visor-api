    patch:
      tags:
        - roles-admin
      summary: Обновить участника (роли/статус)
      operationId: updateMember
      description: |-
        Обновляет статус и/или полный набор ролей участника.

        **Разрешение:** `membership.manage.organization` (ORG_OWNER).

        **Правила иерархии и безопасности:**
        - Нельзя изменять участника, чей наивысший уровень роли **>= собственного** (нет privilege escalation) → `403 ROLE_ASSIGNMENT_FORBIDDEN`.
        - Нельзя снять последнюю роль `ORG_OWNER` с последнего владельца организации → `409 LAST_OWNER_PROTECTION`.
        - `CLUB_ADMIN` требует минимум один клуб в scope → `422 INVALID_ROLE_SCOPE`.
        - `ORG_OWNER` — только передача роли от Owner существующему Admin; клубный scope для Owner не заполняется.
        - `status: SUSPENDED` приостанавливает доступ (membership без прав даже при наличии ролей); `ACTIVE` — восстановление.

        **Аудит:** каждое изменение ролей/статуса фиксируется в audit log (actor, tenant, before/after).
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MemberUserId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
            examples:
              promoteToOwner:
                value:
                  roles:
                    - code: ORG_OWNER
              suspendAdmin:
                value:
                  status: SUSPENDED
      responses:
        '200':
          description: Участник обновлён.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - roles-admin
      summary: Удалить участника
      operationId: removeMember
      description: |-
        Мягко удаляет (REVOKED) membership участника. Роли и клубные scope деактивируются; повторный invite возможен только явным новым приглашением.

        **Правила:**
        - Запрещено удалять участника с ролью >= своей (`403 ROLE_ASSIGNMENT_FORBIDDEN`).
        - Запрещено удалять последнего `ORG_OWNER` (`409 LAST_OWNER_PROTECTION`).
        - Удаление фиксируется в audit log; `reason` обязателен для аудита.

        **Идемпотентность:** повторный delete уже REVOKED membership возвращает 204.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/MemberUserId'
        - $ref: '#/components/parameters/ReasonQuery'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Участник удалён (membership REVOKED).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations/{organizationId}/members/{userId}/club-scopes:
    put:
      tags:
        - roles-admin
      summary: Установить клубный scope админа
      operationId: setMemberClubScopes
      description: |-
        Заменяет список клубов, доступных `CLUB_ADMIN` (полный set, идемпотентно).

