        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRoleAssignRequest'
            examples:
              grantSuperAdmin:
                value:
                  roleCode: SUPER_ADMIN
                  reason: Разблокировка пользователя и аудит инцидента по обращению
                  validUntil: '2026-08-05T11:00:00Z'
      responses:
        '201':
          description: Роль назначена.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
