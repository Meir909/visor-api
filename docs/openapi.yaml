        - ZONE_HAS_RESOURCES
        - ANALYTICS_RANGE_TOO_LARGE
        - INVALID_GRANULARITY
        - ANALYTICS_NOT_READY
        - DISCOUNT_NOT_FOUND
        - DISCOUNT_CODE_TAKEN
        - DISCOUNT_TYPE_CONFLICT
        - DISCOUNT_INVALID_PERIOD
        - DISCOUNT_EXPIRED
        - DISCOUNT_INACTIVE
        - DISCOUNT_LIMIT_REACHED
        - DISCOUNT_NOT_APPLICABLE
        - REDEMPTION_NOT_FOUND
        - REDEMPTION_ALREADY_USED
        - USER_NOT_FOUND
        - PLATFORM_ROLE_FORBIDDEN
        - PLATFORM_ROLE_ALREADY_ASSIGNED
        - PLATFORM_ROLE_NOT_FOUND
        - AUDIT_ENTRY_NOT_FOUND
        - PROVIDER_SIGNATURE_INVALID
        - INVALID_PROVIDER_EVENT
        - PROVIDER_EVENT_NOT_FOUND
        - PROVIDER_CONNECTION_NOT_ACTIVE
        - PROVIDER_STATE_STALE
    PageMeta:
      type: object
      description: Метаданные пагинации для списочных ответов.
      required:
        - page
        - pageSize
        - total
      properties:
        page:
          type: integer
          description: Текущая страница (начиная с 1).
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Размер страницы.
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          description: Общее количество элементов.
          minimum: 0
          example: 120
        hasNextPage:
          type: boolean
          description: Есть ли следующая страница.
          example: true
        nextCursor:
          type:
            - string
            - 'null'
          description: Курсор следующей страницы (если используется курсорная пагинация), иначе null.
          example: eyJvZmZzZXQiOiA0MH0=
    RequestMeta:
      type: object
      description: Метаданные успешного ответа с одним ресурсом.
      properties:
        requestId:
          type: string
          format: uuid
          description: Идентификатор запроса (correlation).
          example: 4b1c9d8e-2f3a-4b5c-8d6e-7f8a9b0c1d2e
        timestamp:
          type: string
          format: date-time
          description: Время формирования ответа (UTC).
          example: '2026-08-04T10:12:30Z'
    ReservationMeta:
      type: object
      description: Метаданные ответа для мутаций бронирования (создание, действия). Содержит актуальную версию агрегата для If-Match.
      required:
        - reservationId
        - version
      properties:
        requestId:
          type: string
          format: uuid
          description: Идентификатор запроса (correlation).
        timestamp:
          type: string
          format: date-time
          description: Время формирования ответа (UTC).
        reservationId:
          type: string
          format: uuid
          description: Идентификатор бронирования.
        reservationNumber:
          type: string
          description: Номер бронирования.
        version:
          type: integer
          description: Текущая версия агрегата (используется в If-Match).
          minimum: 0
        availableActions:
          type: array
          description: Действия, доступные вызывающему для текущего статуса.
          items:
            type: string
    ReservationStatus:
      type: string
      description: Статус бронирования.
      enum:
        - DRAFT
        - PENDING
        - CONFIRMED
        - CHECKED_IN
        - ACTIVE
        - COMPLETED
        - CANCELLED
        - EXPIRED
        - NO_SHOW
        - REJECTED
      x-enum-descriptions:
        DRAFT: Черновик, создан без подтверждения.
        PENDING: Ожидает подтверждения (оплата/депозит или администратор). Слот заблокирован.
        CONFIRMED: Подтверждено, слот закреплён.
        CHECKED_IN: Игрок прибыл, администратор подтвердил приход.
        ACTIVE: Игровая сессия активна.
        COMPLETED: Завершено штатно.
        CANCELLED: Отменено (игроком или администратором до начала).
        EXPIRED: Истекло до активации (hold timeout или ручное действие администратора).
        NO_SHOW: Неявка, игрок не прибыл в льготный период.
        REJECTED: Отклонено администратором.
    ParticipantStatus:
      type: string
      description: Статус участника бронирования.
      enum:
        - INVITED
        - CONFIRMED
        - CHECKED_IN
        - DECLINED
    AllocationStatus:
      type: string
      description: Статус выделения (allocation) ресурса в брони.
      enum:
        - HELD
        - CONFIRMED
        - ACTIVE
        - RELEASED
      x-enum-descriptions:
        HELD: Заблокировано на время брони (до подтверждения).
        CONFIRMED: Подтверждено, блокирует инвентарь.
        ACTIVE: Ресурс используется.
        RELEASED: Освобождено, больше не блокирует инвентарь (история сохраняется).
    ResourceType:
      type: string
      description: Тип резервируемого ресурса.
      enum:
        - COMPUTER
        - VIP_ROOM
    ExtensionRequestStatus:
      type: string
      description: Статус запроса на продление.
      enum:
        - PENDING
        - APPROVED
        - REJECTED
        - EXPIRED
        - CANCELLED
      x-enum-descriptions:
        PENDING: Ожидает решения администратора.
        APPROVED: Продление утверждено, время брони расширено.
        REJECTED: Продление отклонено.
        EXPIRED: Запрос устарел (expires_at).
        CANCELLED: Отменён инициатором.
    AvailabilityStatus:
      type: string
      description: Статус слота доступности.
      enum:
        - AVAILABLE
        - UNAVAILABLE
    ProviderResourceState:
      type: string
      description: |
        Каноническое состояние ресурса по данным Provider (проекция).
        Проекция может быть устаревшей — оценивайте freshness по полю `stateObservedAt`/`lastProviderStateAt`.
      enum:
        - AVAILABLE
        - IN_USE
        - OFFLINE
        - MAINTENANCE
        - UNKNOWN
      x-enum-descriptions:
        AVAILABLE: Ресурс свободен по данным Provider.
        IN_USE: Ресурс занят активной сессией.
        OFFLINE: Ресурс выключен/недоступен.
        MAINTENANCE: Ресурс в техническом режиме.
        UNKNOWN: Состояние неизвестно (не обновлялось). Никогда не трактуется как AVAILABLE.
    ReservationSource:
      type: string
      description: Источник создания бронирования.
      enum:
        - PLAYER_WEB
        - ADMIN
        - MOBILE
        - KIOSK
    ActorType:
      type: string
      description: Тип исполнителя действия.
      enum:
        - USER
        - SYSTEM
        - PROVIDER
        - SUPER_ADMIN
    Reservation:
      type: object
      description: Заголовок бронирования (агрегат). Выделенные ресурсы и участники — в ReservationDetails.
      required:
        - id
        - organizationId
        - clubId
        - playerUserId
        - reservationNumber
        - status
        - startAt
        - endAt
        - price
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор бронирования.
          example: 2cd0f5a8-3e2f-4f8a-9b1c-8d7e6f5a4b3c
        organizationId:
          type: string
          format: uuid
          description: Tenant (организация), владелец брони.
        clubId:
          type: string
          format: uuid
          description: Клуб, в котором создана бронь.
        clubName:
          type:
            - string
            - 'null'
          description: Название клуба (denormalized для отображения).
          example: Cyber Arena
        playerUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Основной игрок / владелец брони. `null` для guest-брони (walk-in), созданной клубом без аккаунта игрока.
        reservationNumber:
          type: string
          maxLength: 32
          description: Человекочитаемый номер брони в рамках клуба.
          example: VR-20260804-00042
        status:
          $ref: '#/components/schemas/ReservationStatus'
        startAt:
          type: string
          format: date-time
          description: Начало брони (UTC).
        endAt:
          type: string
          format: date-time
          description: Окончание брони (UTC). Должно быть позже startAt.
        arrivalDeadlineAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Дедлайн прибытия; обычно startAt + grace клуба (по умолчанию 10 минут).
        checkedInAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время подтверждения прихода.
        checkedInByUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Администратор, подтвердивший приход.
        cancelledAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время отмены.
        cancelledByUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Кто отменил.
        cancellationReason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Причина отмены.
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время завершения.
        expiredAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время перехода в EXPIRED.
        noShowAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время фиксации неявки.
        source:
          $ref: '#/components/schemas/ReservationSource'
        notes:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Заметки (административные, без секретов и PII).
        price:
          $ref: '#/components/schemas/ReservationPrice'
        version:
          type: integer
          minimum: 0
          description: Версия оптимистичной блокировки (для If-Match).
          example: 3
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReservationSummary:
      type: object
      description: Краткое представление бронирования для списков и очередей.
      required:
        - id
        - reservationNumber
        - clubId
        - playerUserId
        - status
        - startAt
        - endAt
        - totalMinor
        - currency
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор бронирования.
        reservationNumber:
          type: string
          description: Номер брони.
          example: VR-20260804-00042
        clubId:
          type: string
          format: uuid
        clubName:
          type:
            - string
            - 'null'
          description: Название клуба.
        playerUserId:
          type: string
          format: uuid
        playerDisplayName:
          type:
            - string
            - 'null'
          description: Имя игрока (для административных списков).
        status:
          $ref: '#/components/schemas/ReservationStatus'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        resourceCodes:
          type: array
          description: Коды выделенных ресурсов для краткого отображения.
          items:
            type: string
          example:
            - PC-12
            - PC-13
        totalMinor:
          type: string
          description: Итоговая сумма в minor units (строка).
          pattern: ^-?\d+$
          example: '600000'
        currency:
          type: string
          description: ISO 4217.
          example: KZT
        version:
          type: integer
          description: Версия агрегата.
        createdAt:
          type: string
          format: date-time
    ReservationDetails:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - type: object
          description: 'Полное представление бронирования: ресурсы, участники, история продлений и доступные действия.'
          required:
            - allocations
            - participants
            - availableActions
          properties:
            allocations:
              type: array
              description: Выделенные ресурсы (компьютеры и/или VIP-комнаты).
              items:
                $ref: '#/components/schemas/ReservationResource'
            participants:
              type: array
              description: Участники брони.
              items:
                $ref: '#/components/schemas/ReservationParticipant'
            extensions:
              type: array
              description: История запросов на продление.
              items:
                $ref: '#/components/schemas/ReservationExtensionRequest'
            availableActions:
              type: array
              description: Действия, доступные вызывающему для текущего статуса и его роли.
              items:
                type: string
                enum:
                  - cancel
                  - requestExtension
                  - checkIn
                  - reject
                  - complete
                  - expire
                  - move
                  - update
              example:
                - cancel
                - requestExtension
    ReservationCreateRequest:
      type: object
      description: |
        Запрос на создание бронирования.

        Валидация полей:
        - `clubId`, `resourceIds[*]` — UUID.
        - `startAt`, `endAt` — ISO 8601 (date-time); `endAt` строго позже `startAt`.
        - `resourceIds` — от 1 до 10 элементов, без дубликатов; либо один VIP room, либо от 1 до 10 компьютеров; смешивать типы запрещено.
        - `participantCount` — от 1 и не более суммарной вместимости ресурсов.
        - `notes` — до 1000 символов.
        - `discountCode` — до 64 символов.
      required:
        - clubId
        - resourceIds
        - startAt
        - endAt
      properties:
        clubId:
          type: string
          format: uuid
          description: Клуб, в котором создаётся бронь.
        resourceIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: Ресурсы брони (один VIP room либо компьютеры).
          items:
            type: string
            format: uuid
          example:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        startAt:
          type: string
          format: date-time
          description: Начало брони. Не ранее чем за 24 часа от текущего момента.
        endAt:
          type: string
          format: date-time
          description: Окончание брони. Длительность от минимальной (конфигурируемой) до 10 часов.
        participantCount:
          type: integer
          minimum: 1
          default: 1
          description: Число участников (не более суммарной вместимости ресурсов).
        notes:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Заметки.
        discountCode:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Код промокода (если применим к клубу).
        source:
          $ref: '#/components/schemas/ReservationSource'
          default: PLAYER_WEB
    ReservationUpdateRequest:
      type: object
      description: |
        Запрос на обновление бронирования администратором. Требует заголовок `If-Match` с текущей версией.

        Правила:
        - Перенос времени повторно проверяет пересечения и рабочие часы клуба.
        - `participantCount` не может превышать суммарную вместимость ресурсов.
        - При изменении времени обязателен `reason` (аудит).
      properties:
        notes:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Заметки.
        participantCount:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Новое число участников.
        startAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Перенос начала брони.
        endAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Перенос окончания брони.
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Причина изменения (обязательна для переноса времени).
    ReservationCancelRequest:
      type: object
      description: |
        Запрос на отмену бронирования.

        Правила:
        - Игрок отменяет до начала; отмена позже cutoff (обычно за 3 часа до старта) запрещена → `422 CANCELLATION_NOT_ALLOWED`.
        - Администратор отменяет в любой момент до завершения; `reason` обязателен.
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Причина отмены.
        notifyPlayer:
          type: boolean
          default: true
          description: Уведомить игрока об отмене.
    ReservationExtensionRequestCreate:
      type: object
      description: |
        Запрос на продление брони.

        Правила:
        - `requestedEndAt` строго позже текущего `endAt`.
        - Суммарная длительность (startAt → requestedEndAt) не превышает 10 часов.
        - Бронь должна быть в статусе `CHECKED_IN` или `ACTIVE` → иначе `422 EXTENSION_NOT_ALLOWED`.
        - На новый интервал не должно быть пересечений с другими активными бронями.
        - Решение принимает администратор; запрос не меняет бронь до утверждения.
      required:
        - requestedEndAt
      properties:
        requestedEndAt:
          type: string
          format: date-time
          description: Новое желаемое окончание брони.
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Причина продления.
    ReservationExtensionRequest:
      type: object
      description: Запрос на продление брони. Не мутирует бронь до утверждения администратором.
      required:
        - id
        - reservationId
        - requestedEndAt
        - status
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор запроса на продление.
        reservationId:
          type: string
          format: uuid
          description: Бронирование, для которого запрошено продление.
        clubId:
          type: string
          format: uuid
          description: Клуб.
        requestedEndAt:
          type: string
          format: date-time
          description: Желаемое новое окончание брони.
        status:
          $ref: '#/components/schemas/ExtensionRequestStatus'
        requestedByUserId:
          type: string
          format: uuid
          description: Инициатор запроса.
        reviewedByUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Администратор, принявший решение.
        reviewedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время решения.
        reviewReason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Комментарий к решению.
        additionalAmountMinor:
          type:
            - string
            - 'null'
          pattern: ^-?\d+$
          description: Дополнительная сумма при утверждении (minor units, строка).
        currency:
          type:
            - string
            - 'null'
          description: ISO 4217.
        expiresAt:
          type: string
          format: date-time
          description: Дедлайн решения; после него запрос автоматически переходит в EXPIRED.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReservationParticipant:
      type: object
      description: Участник бронирования (зарегистрированный игрок или гость).
      required:
        - id
        - participantStatus
        - isPrimary
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор участника.
        reservationId:
          type: string
          format: uuid
          description: Бронирование.
        userId:
          type:
            - string
            - 'null'
          format: uuid
          description: Зарегистрированный пользователь, если известен.
        guestName:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Имя гостя, если пользователь не зарегистрирован.
        guestPhoneE164:
          type:
            - string
            - 'null'
          maxLength: 20
          pattern: ^\+[1-9]\d{1,14}$
          description: Телефон гостя в формате E.164 (защищённые PII).
        participantStatus:
          $ref: '#/components/schemas/ParticipantStatus'
        isPrimary:
          type: boolean
          description: Основной участник (владелец брони). Ровно один на бронь.
        checkedInAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время подтверждения прихода участника.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReservationResource:
      type: object
      description: Выделенный ресурс (allocation) в брони — компьютер или VIP-комната.
      required:
        - allocationId
        - resourceId
        - resourceType
        - code
        - displayName
        - status
        - startsAt
        - endsAt
      properties:
        allocationId:
          type: string
          format: uuid
          description: Идентификатор выделения.
        resourceId:
          type: string
          format: uuid
          description: Идентификатор резервируемого ресурса.
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        code:
          type: string
          description: Стабильный код ресурса в клубе.
          example: PC-12
        displayName:
          type: string
          description: Отображаемое имя ресурса.
        zoneId:
          type:
            - string
            - 'null'
          format: uuid
          description: Зона ресурса.
        zoneName:
          type:
            - string
            - 'null'
          description: Название зоны.
        status:
          $ref: '#/components/schemas/AllocationStatus'
        startsAt:
          type: string
          format: date-time
          description: Начало выделения.
        endsAt:
          type: string
          format: date-time
          description: Конец выделения.
        releasedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время освобождения ресурса.
        releaseReason:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Причина освобождения (cancellation, move, completion, repair).
        movedFromAllocationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Ссылка на исходное выделение при перемещении.
        computer:
          allOf:
            - $ref: '#/components/schemas/ReservationComputer'
            - type: object
              description: Заполняется при resourceType = COMPUTER.
        vipRoom:
          allOf:
            - $ref: '#/components/schemas/ReservationVIPRoom'
            - type: object
              description: Заполняется при resourceType = VIP_ROOM.
    ReservationComputer:
      type: object
      description: Сведения о компьютере в составе брони.
      required:
        - computerId
        - number
        - displayName
      properties:
        computerId:
          type: string
          format: uuid
          description: Идентификатор компьютера.
        number:
          type: integer
          minimum: 1
          description: Номер компьютера в клубе.
        displayName:
          type: string
          description: Отображаемое имя.
        gpu:
          type:
            - string
            - 'null'
          maxLength: 160
          description: Видеокарта.
        cpu:
          type:
            - string
            - 'null'
          maxLength: 160
          description: Процессор.
        ramGb:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Оперативная память, ГБ.
        monitor:
          type:
            - string
            - 'null'
          maxLength: 160
          description: Монитор.
        state:
          $ref: '#/components/schemas/ProviderResourceState'
          description: Последняя известная проекция состояния от Provider.
    ReservationVIPRoom:
      type: object
      description: Сведения о VIP-комнате в составе брони.
      required:
        - roomId
        - displayName
        - seatCapacity
      properties:
        roomId:
          type: string
          format: uuid
          description: Идентификатор VIP-комнаты.
        roomNumber:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Номер комнаты.
        displayName:
          type: string
          description: Отображаемое имя.
        seatCapacity:
          type: integer
          minimum: 1
          description: Вместимость по участникам.
        computerCount:
          type: integer
          minimum: 0
          description: Количество компьютеров в комнате.
        amenities:
          type: array
          description: Удобства.
          items:
            type: string
          example:
            - projector
            - lounge
    ReservationPrice:
      type: object
      description: |
        Финансовый снимок бронирования. Все суммы — целые числа в минимальных единицах валюты, строкой.
        Историческая цена не пересчитывается при изменении тарифов.
      required:
        - subtotalMinor
        - discountMinor
        - totalMinor
        - currency
      properties:
        subtotalMinor:
          type: string
          pattern: ^-?\d+$
          description: Сумма до скидок.
          example: '600000'
        discountMinor:
          type: string
          pattern: ^-?\d+$
          description: Суммарная скидка (неотрицательная).
          example: '60000'
        totalMinor:
          type: string
          pattern: ^-?\d+$
          description: Итоговая сумма (subtotal - discount).
          example: '540000'
        depositMinor:
          type: string
          pattern: ^-?\d+$
          description: Требуемый/внесённый депозит.
          example: '120000'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: ISO 4217.
          example: KZT
        components:
          type: array
          description: Объяснимая структура цены.
          items:
            type: object
            required:
              - componentType
              - description
              - amountMinor
            properties:
              componentType:
                type: string
                enum:
                  - BASE
                  - OVERRIDE
                  - SURCHARGE
                  - DISCOUNT
                  - ROUNDING
              description:
                type: string
                maxLength: 240
                description: Замороженное описание строки.
              quantity:
                type: number
                description: Количество (часы/единицы).
              amountMinor:
                type: string
                pattern: ^-?\d+$
                description: Сумма строки (скидки — отрицательные).
    ReservationConflict:
      type: object
      description: Детализация конфликта бронирования (пересечение интервалов).
      required:
        - code
        - resourceId
        - resourceType
        - requestedStartAt
        - requestedEndAt
      properties:
        code:
          type: string
          description: Код конфликта.
          enum:
            - RESERVATION_SLOT_CONFLICT
            - COMPUTER_ALREADY_RESERVED
            - VIP_ROOM_OCCUPIED
        title:
          type: string
          description: Краткое описание.
        resourceId:
          type: string
          format: uuid
          description: Ресурс, с которым конфликт.
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        resourceCode:
          type: string
          description: Код ресурса.
          example: PC-12
        conflictingReservationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Существующая бронь, пересекающаяся с запросом.
        conflictingPeriod:
          type: object
          description: Пересекающийся интервал существующей брони.
          properties:
            startAt:
              type: string
              format: date-time
            endAt:
              type: string
              format: date-time
        requestedStartAt:
          type: string
          format: date-time
          description: Запрошенное начало.
        requestedEndAt:
          type: string
          format: date-time
          description: Запрошенное окончание.
    ReservationValidation:
      type: object
      description: Результат валидации возможности создания брони (без фактического создания).
      required:
        - valid
        - conflicts
      properties:
        valid:
          type: boolean
          description: true, если бронь может быть создана без конфликтов и нарушений правил.
        checks:
          type: object
          description: Результаты отдельных проверок.
          properties:
            clubOpen:
              type: boolean
              description: Клуб открыт в интервале (расписание и закрытия).
            withinBookingHorizon:
              type: boolean
              description: Начало не позднее чем за 24 часа от текущего момента.
            durationValid:
              type: boolean
              description: Длительность в пределах (мин — конфигурируемо, макс — 10 часов).
            noOverlap:
              type: boolean
              description: Нет пересечений с активными бронями.
            providerStateFresh:
              type: boolean
              description: Состояние ресурса от Provider свежее (в пределах provider_state_ttl клуба).
        conflicts:
          type: array
          description: Конфликты пересечения.
          items:
            $ref: '#/components/schemas/ReservationConflict'
        warnings:
          type: array
          description: Некритичные предупреждения (например, быстрое окончание смены клуба).
          items:
            type: string
    ReservationTimeline:
      type: object
      description: Хронология событий бронирования (включая продления, перемещения, обновления).
      required:
        - reservationId
        - items
      properties:
        reservationId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
    TimelineEntry:
      type: object
      description: Запись хронологии бронирования.
      required:
        - eventType
        - occurredAt
      properties:
        eventType:
          type: string
          description: Тип события.
          enum:
            - CREATED
            - CONFIRMED
            - CHECKED_IN
            - ACTIVE
            - COMPLETED
            - CANCELLED
            - EXPIRED
            - NO_SHOW
            - REJECTED
            - EXTENSION_REQUESTED
            - EXTENSION_APPROVED
            - EXTENSION_REJECTED
            - MOVED
            - UPDATED
        occurredAt:
          type: string
          format: date-time
          description: Время события (UTC).
        actorType:
          $ref: '#/components/schemas/ActorType'
        actorUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Пользователь-инициатор, если применимо.
        description:
          type: string
          description: Краткое описание события.
        metadata:
          type: object
          description: Дополнительный контекст (без PII и секретов).
    ReservationHistory:
      type: object
      description: Полная история смены статусов бронирования (immutable, append-only).
      required:
        - reservationId
        - items
      properties:
        reservationId:
          type: string
          format: uuid
        items:
          type: array
          description: Записи переходов статусов в хронологическом порядке.
          items:
            $ref: '#/components/schemas/ReservationStatusHistoryEntry'
    ReservationStatusHistoryEntry:
      type: object
      description: Запись перехода статуса бронирования (immutable).
      required:
        - fromStatus
        - toStatus
        - actorType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор записи.
        reservationId:
          type: string
          format: uuid
        fromStatus:
          anyOf:
            - $ref: '#/components/schemas/ReservationStatus'
            - type: 'null'
          description: Исходный статус; null для создания брони.
        toStatus:
          $ref: '#/components/schemas/ReservationStatus'
          description: Новый статус.
        actorType:
          $ref: '#/components/schemas/ActorType'
        changedByUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Пользователь-инициатор; null для системных переходов.
        reasonCode:
          type:
            - string
            - 'null'
          maxLength: 100
          description: Стабильный код причины перехода.
        metadata:
          type: object
          description: Минимальный контекст перехода (без PII и секретов).
        createdAt:
          type: string
          format: date-time
          description: Время перехода (UTC).
    ReservationAvailability:
      type: object
      description: Доступность ресурсов клуба в запрошенном интервале.
      required:
        - clubId
        - from
        - to
        - resources
      properties:
        clubId:
          type: string
          format: uuid
          description: Клуб.
        from:
          type: string
          format: date-time
          description: Начало запрошенного интервала (inclusive).
        to:
          type: string
          format: date-time
          description: Конец запрошенного интервала (exclusive).
        timezone:
          type: string
          description: IANA-таймзона клуба (локальные правила).
          example: Asia/Almaty
        resources:
          type: array
          description: Доступность по каждому ресурсу.
          items:
            $ref: '#/components/schemas/ReservationResourceAvailability'
    ReservationResourceAvailability:
      type: object
      description: Доступность одного ресурса в запрошенном интервале.
      required:
        - resourceId
        - resourceType
        - code
        - displayName
        - availability
      properties:
        resourceId:
          type: string
          format: uuid
          description: Идентификатор ресурса.
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        code:
          type: string
          description: Код ресурса в клубе.
          example: PC-12
        displayName:
          type: string
          description: Отображаемое имя.
        zoneId:
          type:
            - string
            - 'null'
          format: uuid
          description: Зона.
        zoneName:
          type:
            - string
            - 'null'
          description: Название зоны.
        state:
          $ref: '#/components/schemas/ProviderResourceState'
          description: Последняя проекция состояния от Provider (может быть устаревшей).
        stateObservedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время наблюдения состояния (freshness).
        availability:
          type: array
          description: Слоты доступности в пределах интервала.
          items:
            type: object
            required:
              - startAt
              - endAt
              - status
            properties:
              startAt:
                type: string
                format: date-time
              endAt:
                type: string
                format: date-time
              status:
                $ref: '#/components/schemas/AvailabilityStatus'
              reason:
                type:
                  - string
                  - 'null'
                description: Причина недоступности (бронь, сессия, maintenance, закрытие клуба).
              conflictingReservationId:
                type:
                  - string
                  - 'null'
                format: uuid
                description: Пересекающаяся бронь, если причина — бронь.
    ReservationStatusView:
      type: object
      description: Текущий статус бронирования и доступные действия.
      required:
        - reservationId
        - status
        - version
      properties:
        reservationId:
          type: string
          format: uuid
          description: Идентификатор бронирования.
        status:
          $ref: '#/components/schemas/ReservationStatus'
        version:
          type: integer
          description: Версия агрегата.
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения.
        availableActions:
          type: array
          description: Действия, доступные вызывающему.
          items:
            type: string
          example:
            - cancel
            - requestExtension
    UserStatus:
      type: string
      description: Статус учётной записи пользователя.
      enum:
        - ACTIVE
        - BLOCKED
        - DEACTIVATED
      example: ACTIVE
    User:
      type: object
      description: Публичный профиль пользователя Visora (игрок и/или сотрудник). Глобальная identity; tenant-роли хранятся в memberships.
      required:
        - id
        - status
        - locale
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор пользователя.
        phoneE164:
          type:
            - string
            - 'null'
          maxLength: 20
          pattern: ^\+[1-9]\d{1,14}$
          description: Нормализованный номер телефона (E.164). Возвращается только владельцу профиля; в логах маскируется.
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Отображаемое имя.
        emailNormalized:
          type:
            - string
            - 'null'
          maxLength: 320
          format: email
          description: Нормализованный email (будущая контактная/identity-проверка).
        locale:
          type: string
          maxLength: 16
          description: Предпочитаемая локаль, например `ru-KZ`.
          example: ru-KZ
        status:
          $ref: '#/components/schemas/UserStatus'
        phoneVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время подтверждения телефона (первый успешный OTP).
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время последнего успешного входа.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OtpRequest:
      type: object
      description: Запрос одноразового кода (OTP) по номеру телефона.
      required:
        - phone
      properties:
        phone:
          type: string
          maxLength: 20
          pattern: ^\+[1-9]\d{1,14}$
          description: Номер телефона в формате E.164, например `+77012345678`.
          example: '+77012345678'
        deviceId:
          type: string
          maxLength: 160
          description: Клиентский идентификатор устройства для rate limiting и привязки сессии.
          example: android-8f4a2c
    OtpChallenge:
      type: object
      description: Результат запроса OTP. Одноразовый challenge; код действует 5 минут.
      required:
        - challengeId
        - retryAfterSeconds
        - expiresInSeconds
      properties:
        challengeId:
          type: string
          format: uuid
          description: Идентификатор challenge для последующей верификации.
          example: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        maskedPhone:
          type: string
          description: Маскированный телефон, например `+7 701 *** 78 90`. Не раскрывает факт существования пользователя.
          example: +7 701 *** 78 90
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: Минимальный интервал до повторной отправки (не менее 60 секунд).
          example: 60
        expiresInSeconds:
          type: integer
          minimum: 1
          description: Срок действия кода (5 минут).
          example: 300
        devStaticCode:
          type:
            - string
            - 'null'
          description: Статический код для non-production среды. Возвращается только в dev и явно маркируется; в production поле отсутствует.
    OtpVerifyRequest:
      type: object
      description: Верификация одноразового кода. Успех создаёт server-side session и пару токенов.
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
          format: uuid
          description: Идентификатор challenge из ответа на запрос OTP.
        code:
          type: string
          pattern: ^\d{4,6}$
          minLength: 4
          maxLength: 6
          description: Одноразовый код.
          example: '481293'
        deviceId:
          type: string
          maxLength: 160
          description: Клиентский идентификатор устройства; привязывается к сессии.
        deviceName:
          type: string
          maxLength: 160
          description: Отображаемое имя устройства для списка сессий.
          example: Chrome on macOS
    AuthTokens:
      type: object
      description: Пара токенов после успешной аутентификации или refresh. Refresh token для web передаётся в HttpOnly Secure cookie; для mobile — в теле ответа.
      required:
        - accessToken
        - tokenType
        - expiresInSeconds
        - session
      properties:
        accessToken:
          type: string
          description: 'Короткоживущий JWT (10–15 минут). Передаётся в `Authorization: Bearer <token>`.'
        tokenType:
          type: string
          enum:
            - Bearer
          default: Bearer
        expiresInSeconds:
          type: integer
          description: Срок действия access token в секундах.
          example: 900
        refreshToken:
          type:
            - string
            - 'null'
          description: Opaque refresh token. Возвращается в теле только для mobile; для web передаётся в Set-Cookie (HttpOnly, Secure, SameSite=Lax) и здесь отсутствует.
        session:
          $ref: '#/components/schemas/AuthSession'
    AuthSession:
      type: object
      description: Серверная сессия аутентификации. Хранит устройство и состояние отзыва; привязана к паре токенов.
      required:
        - id
        - userId
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор сессии (claim `sid` access token).
        userId:
          type: string
          format: uuid
          description: Владелец сессии.
        deviceId:
          type:
            - string
            - 'null'
          maxLength: 160
          description: Клиентский идентификатор устройства.
        deviceName:
          type:
            - string
            - 'null'
          maxLength: 160
          description: Отображаемое имя устройства.
        activeOrganizationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Последний выбранный tenant-контекст. Не является авторизационным grant; membership всегда проверяется отдельно.
        isCurrent:
          type: boolean
          description: Текущая сессия вызывающего.
          default: false
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время последней ротации refresh token.
        expiresAt:
          type: string
          format: date-time
          description: Срок действия refresh token (30 дней).
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Время отзыва (logout, replay, администратор).
        revokeReason:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Причина отзыва.
    RevokeSessionRequest:
      type: object
      description: Запрос на отзыв сессии. Позволяет указать причину для аудита.
      properties:
        reason:
          type: string
          maxLength: 120
          description: Причина отзыва (например, `Устройство потеряно`).
    SessionRevokeReason:
      type: string
      description: Причина отзыва refresh-сессии.
      enum:
        - LOGOUT
        - SECURITY
        - ADMIN
        - REPLACED
      example: LOGOUT
    RoleCode:
      type: string
      description: 'Машинный код роли RBAC. Иерархия (сверху вниз): `ORG_OWNER` > `CLUB_ADMIN` > `PLAYER`. `PLATFORM_ADMIN` зарезервирован и в MVP не назначается.'
      enum:
        - PLAYER
        - CLUB_ADMIN
        - ORG_OWNER
        - PLATFORM_ADMIN
      example: CLUB_ADMIN
    RoleScope:
      type: string
      description: 'Scope роли: на какой ресурс распространяются права.'
      enum:
        - PLATFORM
        - ORGANIZATION
        - CLUB
      example: ORGANIZATION
    Role:
      type: object
      description: Каталожная запись роли RBAC. Каталог системных ролей, не содержит пользовательских данных.
      required:
        - code
        - name
        - scopeType
        - hierarchyLevel
        - isSystem
        - permissions
      properties:
        code:
          $ref: '#/components/schemas/RoleCode'
        name:
          type: string
          description: Человекочитаемое имя роли.
          example: Администратор клуба
        description:
          type:
            - string
            - 'null'
          description: Назначение роли.
        scopeType:
          $ref: '#/components/schemas/RoleScope'
        hierarchyLevel:
          type: integer
          minimum: 1
          description: |
            Уровень иерархии для правил назначения ролей:
            - `1` — PLAYER
            - `2` — CLUB_ADMIN
            - `3` — ORG_OWNER
            - `4` — PLATFORM_ADMIN (зарезервирован)

            Назначать/отзывать можно только роли **строго ниже** своей; изменять участника с ролью **не ниже** своей запрещено.
          example: 2
        isSystem:
          type: boolean
          description: Системная роль — нельзя модифицировать/удалять.
          default: true
        isAssignable:
          type: boolean
          description: Можно ли назначить через organization membership. `PLATFORM_ADMIN` в MVP не назначается.
          default: true
        permissions:
          type: array
          description: Гранты, дающие доступ к операциям API. Проверка на уровне только UI запрещена.
          items:
            type: string
            pattern: ^[a-z0-9_]+(\.[a-z0-9_]+)+$
          example:
            - reservation.read.club
            - reservation.check_in.club
    MembershipStatus:
      type: string
      description: Статус membership (принадлежности пользователя к организации).
      enum:
        - INVITED
        - ACTIVE
        - SUSPENDED
        - REVOKED
      example: ACTIVE
    Membership:
      type: object
      description: Принадлежность пользователя к организации (tenant context для RBAC). Membership служит контейнером ролей; `INVITED` membership — это и есть приглашение.
      required:
        - id
        - organizationId
        - userId
        - status
        - roles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор membership (используется как идентификатор приглашения).
        organizationId:
          type: string
          format: uuid
        organizationName:
          type:
            - string
            - 'null'
          maxLength: 160
          description: Название организации (для списков игрока).
        userId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/UserSummary'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        roles:
          type: array
          description: Назначенные роли с клубными scope.
          items:
            $ref: '#/components/schemas/MemberRole'
        invitedByUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Кто пригласил (Owner/Admin).
        invitedAt:
          type:
            - string
            - 'null'
          format: date-time
        acceptedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Заполняется при принятии приглашения (status → ACTIVE).
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokeReason:
          type:
            - string
            - 'null'
          maxLength: 240
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MemberRole:
      type: object
      description: Назначенная участнику роль с необязательным клубным scope (для CLUB_ADMIN).
      required:
        - code
      properties:
        code:
          $ref: '#/components/schemas/RoleCode'
        clubIds:
          type: array
          description: Клубы, на которые распространяется роль. Обязательно не менее одного для `CLUB_ADMIN`; для `ORG_OWNER` не заполняется (scope — вся организация).
          items:
            type: string
            format: uuid
          example:
            - 4b1c9d8e-1a2b-4c3d-9e8f-7a6b5c4d3e2f
    UserSummary:
      type: object
      description: Краткое публичное представление пользователя (для списков и аудита). PII маскируется.
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Отображаемое имя.
        maskedPhone:
          type:
            - string
            - 'null'
          maxLength: 20
          description: Маскированный телефон, например `+7 701 *** 78 90`.
        status:
          $ref: '#/components/schemas/UserStatus'
    MemberInviteRequest:
      type: object
      description: Запрос на приглашение участника в организацию (Owner). Создаёт membership со статусом `INVITED`.
      required:
        - roleCode
      properties:
        userId:
          type: string
          format: uuid
          description: Существующий пользователь. Альтернативно приглашение по `phone`.
        phone:
          type: string
          maxLength: 20
          pattern: ^\+[1-9]\d{1,14}$
          description: Телефон (E.164) для приглашения незарегистрированного пользователя; пользователь будет создан при первом входе.
        roleCode:
          $ref: '#/components/schemas/RoleCode'
        clubIds:
          type: array
          description: Клубный scope для `CLUB_ADMIN` (обязателен при этой роли).
          items:
            type: string
            format: uuid
        message:
          type: string
          maxLength: 500
          description: Сопроводительное сообщение к приглашению.
    MemberUpdateRequest:
      type: object
      description: Обновление участника Owner'ом. Поля применяются атомарно; незаполненные поля не изменяются. Смена ролей — замена полного набора (idempotent set).
      properties:
        status:
          $ref: '#/components/schemas/MembershipStatus'
          description: Перевод в ACTIVE / SUSPENDED (повторная активация, блокировка).
        roles:
          type: array
          description: Полный новый набор ролей участника (замена). Правила иерархии и last-owner protection применяются сервером.
          items:
            $ref: '#/components/schemas/MemberRole'
    ClubScopeUpdateRequest:
      type: object
      description: Установка клубного scope для CLUB_ADMIN (полная замена списка клубов).
      required:
        - clubIds
      properties:
        clubIds:
          type: array
          minItems: 1
          description: Клубы, доступные админу. Клубы должны принадлежать организации membership.
          items:
            type: string
            format: uuid
    MyAccess:
      type: object
      description: Полный доступ текущего пользователя (AuthContext для фронтенда). Позволяет UI корректно показать/скрыть разделы.
      required:
        - userId
        - platformRoles
        - memberships
      properties:
        userId:
          type: string
          format: uuid
        platformRoles:
          type: array
          description: Глобальные (платформенные) роли. Каждый активный пользователь имеет `PLAYER`.
          items:
            $ref: '#/components/schemas/RoleCode'
          example:
            - PLAYER
        memberships:
          type: array
          description: Tenants пользователя с ролями и клубными scope.
          items:
            type: object
            required:
              - organizationId
              - organizationName
              - status
              - roles
            properties:
              organizationId:
                type: string
                format: uuid
              organizationName:
                type: string
                maxLength: 160
              status:
                $ref: '#/components/schemas/MembershipStatus'
              roles:
                type: array
                items:
                  type: object
                  required:
                    - code
                  properties:
                    code:
                      $ref: '#/components/schemas/RoleCode'
                    clubIds:
                      type: array
                      items:
                        type: string
                        format: uuid
    InvitationSummary:
      type: object
      description: Приглашение в организацию, ожидающее решения игрока.
      required:
        - id
        - organizationId
        - organizationName
        - invitedByUserId
        - invitedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор membership-приглашения.
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
          maxLength: 160
        invitedByUserId:
          type: string
          format: uuid
        invitedByDisplayName:
          type:
            - string
            - 'null'
          maxLength: 120
        invitedAt:
          type: string
          format: date-time
        message:
          type:
            - string
            - 'null'
          maxLength: 500
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Срок действия приглашения (конфигурируется организацией; MVP default 7 дней).
    OrganizationStatus:
      type: string
      description: Статус организации (tenant). `CLOSED` необратим (soft-delete); `SUSPENDED` блокирует запись, но данные сохраняются.
      enum:
        - ACTIVE
        - SUSPENDED
        - CLOSED
      example: ACTIVE
    Organization:
      type: object
      description: Организация — tenant и граница владения клубами и бизнес-данными. Не является ролью; роли пользователь получает через membership организации.
      required:
        - id
        - name
        - slug
        - status
        - defaultCurrency
        - defaultTimezone
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор организации (tenant).
        name:
          type: string
          maxLength: 160
          description: Юридическое или отображаемое название.
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,98}[a-z0-9])?$
          description: Стабильный tenant-идентификатор (lowercase, `[a-z0-9-]`, уникален среди активных).
          example: caspian-esports
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        defaultCurrency:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: ISO 4217; MVP default `KZT`.
          example: KZT
        defaultTimezone:
          type: string
          maxLength: 64
          description: IANA time zone (fallback для клубов без собственной).
          example: Asia/Almaty
        settings:
          $ref: '#/components/schemas/OrganizationSettings'
        clubsCount:
          type: integer
          minimum: 0
          description: Количество активных клубов (агрегат для дашборда).
          example: 2
        membersCount:
          type: integer
          minimum: 0
          description: Количество активных участников (агрегат для дашборда).
          example: 7
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationSummary:
      type: object
      description: Краткое представление организации для списков (например, `/me/organizations`).
      required:
        - id
        - name
        - slug
        - status
        - defaultCurrency
        - defaultTimezone
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        defaultCurrency:
          type: string
          maxLength: 3
        defaultTimezone:
          type: string
          maxLength: 64
        myRole:
          $ref: '#/components/schemas/RoleCode'
          description: Моя наивысшая роль в этой организации.
        clubsCount:
          type: integer
          minimum: 0
          example: 2
    OrganizationCreateRequest:
      type: object
      description: Создание организации. В той же транзакции создаётся membership вызывающего с ролью `ORG_OWNER`.
      required:
        - name
        - slug
      properties:
        name:
          type: string
          maxLength: 160
          description: Название организации.
          example: Caspian Esports
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,98}[a-z0-9])?$
          description: |
            Уникальный tenant-идентификатор (lowercase, `[a-z0-9-]`).
            Занят → `409 ORGANIZATION_SLUG_TAKEN`; неверный формат → `422 INVALID_SLUG`.
          example: caspian-esports
        defaultCurrency:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: ISO 4217; default `KZT`.
          default: KZT
        defaultTimezone:
          type: string
          maxLength: 64
          description: IANA time zone; default `Asia/Almaty`.
          default: Asia/Almaty
    OrganizationUpdateRequest:
      type: object
      description: Обновление реквизитов организации. Незаполненные поля не изменяются. Смена `slug` и `defaultCurrency` аудируется.
      properties:
        name:
          type: string
          maxLength: 160
          description: Название организации.
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,98}[a-z0-9])?$
          description: Уникальный tenant-идентификатор. Занят → `409 ORGANIZATION_SLUG_TAKEN`.
        defaultCurrency:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: ISO 4217.
        defaultTimezone:
          type: string
          maxLength: 64
          description: IANA time zone.
    OrganizationSettings:
      type: object
      description: Organization-level настройки (jsonb). Не реляционные конфигурационные значения; клубная политика бронирования живёт в модуле Clubs.
      additionalProperties: false
      properties:
        onboardingComplete:
          type: boolean
          description: Пройден ли онбординг (создан клуб, layout, тарифы).
          default: false
        notificationDefaults:
          type: object
          description: Дефолты уведомлений для клубов организации.
          additionalProperties: false
          properties:
            locale:
              type: string
              maxLength: 16
              description: Язык уведомлений, например `ru-KZ`.
            reminderLeadMinutes:
              type: array
              description: Интервалы напоминаний до начала брони (минуты).
              items:
                type: integer
                minimum: 1
        invoicePrefix:
          type: string
          maxLength: 20
          description: Префикс номеров чеков/броней, например `CE`.
      example:
        onboardingComplete: true
        notificationDefaults:
          locale: ru-KZ
          reminderLeadMinutes:
            - 180
            - 30
    OrganizationSettingsUpdateRequest:
      type: object
      description: 'Обновление organization-level настроек. Слияние на уровне объекта: переданные подполя заменяются, отсутствующие сохраняются (deep merge).'
      properties:
        onboardingComplete:
          type: boolean
        notificationDefaults:
          type: object
          additionalProperties: false
          properties:
            locale:
              type: string
              maxLength: 16
            reminderLeadMinutes:
              type: array
              items:
                type: integer
                minimum: 1
        invoicePrefix:
          type: string
          maxLength: 20
    OrganizationActionRequest:
      type: object
      description: Действие жизненного цикла организации (suspend / reactivate / close). Для suspend/close требуется причина.
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 240
          description: Причина действия. Обязательна для suspend и close; аудируется.
          example: Переезд в новое здание
    SlugAvailability:
      type: object
      description: Результат проверки доступности slug.
      required:
        - slug
        - available
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,98}[a-z0-9])?$
        available:
          type: boolean
          description: Свободен ли slug для создания организации.
        suggestion:
          type:
            - string
            - 'null'
          maxLength: 100
          description: Рекомендуемая альтернатива, если занят.
    ClubStatus:
      type: string
      description: Статус клуба. `DRAFT` не публикуется; `ACTIVE` доступен игрокам; `MAINTENANCE` блокирует новые брони; `CLOSED` — soft-delete.
      enum:
        - DRAFT
        - ACTIVE
        - MAINTENANCE
        - CLOSED
      example: ACTIVE
    Club:
      type: object
      description: Полная карточка клуба (управляемый вид, CLUB_ADMIN/ORG_OWNER) с реквизитами и политикой бронирования.
      required:
        - id
        - organizationId
        - name
        - slug
        - status
        - timezone
        - currency
        - addressLine
        - city
        - countryCode
        - defaultPriceMinor
        - reservationHorizonMinutes
        - arrivalGraceMinutes
        - cancellationCutoffMinutes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          description: Владеющий tenant; неизменяем после активации.
        name:
          type: string
          maxLength: 160
          description: Публичное название клуба.
        slug:
          type: string
          maxLength: 120
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,118}[a-z0-9])?$
          description: URL-safe идентификатор, уникальный в пределах организации.
        description:
          type:
            - string
            - 'null'
          description: Публичное описание.
        status:
          $ref: '#/components/schemas/ClubStatus'
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone клуба.
          example: Asia/Almaty
        currency:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: Валюта цен клуба (ISO 4217).
          example: KZT
        phoneE164:
          type:
            - string
            - 'null'
          maxLength: 20
          pattern: ^\+[1-9]\d{1,14}$
          description: Контактный телефон.
        addressLine:
          type: string
          maxLength: 300
          description: Отображаемый адрес.
          example: пр. Достык 36, ТРЦ Mega
        city:
          type: string
          maxLength: 120
          example: Алматы
        countryCode:
          type: string
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2.
          example: KZ
        latitude:
          type:
            - number
            - 'null'
          minimum: -90
          maximum: 90
          description: Широта; задаётся вместе с longitude.
          example: 43.238293
        longitude:
          type:
            - number
            - 'null'
          minimum: -180
          maximum: 180
          description: Долгота.
          example: 76.945465
        defaultPriceMinor:
          type: string
          pattern: ^-?\d+$
          description: Базовая почасовая цена в minor units (строка, чтобы не терять точность). Например `"120000"` = 1 200 ₸/час.
          example: '120000'
        reservationHorizonMinutes:
          type: integer
          minimum: 1
          description: Горизонт бронирования вперёд (MVP default 1 440 = 24 часа).
          example: 1440
        arrivalGraceMinutes:
          type: integer
          minimum: 1
          description: Grace-период неявки после начала (MVP default 10).
          example: 10
        cancellationCutoffMinutes:
          type: integer
          minimum: 1
          description: За сколько до начала можно отменить бронь без штрафа (MVP default 180).
          example: 180
        settings:
          type: object
          description: Клубные feature-флаги и конфигурация (jsonb).
          example:
            requireDepositForNewPlayers: true
        workingHours:
          type: array
          description: Недельное расписание (управляемый вид).
          items:
            $ref: '#/components/schemas/WorkingHoursEntry'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClubSummary:
      type: object
      description: Краткая публичная карточка клуба для каталога (только ACTIVE).
      required:
        - id
        - name
        - slug
        - city
        - countryCode
        - timezone
        - currency
        - defaultPriceMinor
        - addressLine
        - status
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 120
        description:
          type:
            - string
            - 'null'
        city:
          type: string
          maxLength: 120
        countryCode:
          type: string
          maxLength: 2
        timezone:
          type: string
          maxLength: 64
        currency:
          type: string
          maxLength: 3
        defaultPriceMinor:
          type: string
          pattern: ^-?\d+$
          description: Базовая почасовая цена в minor units.
        addressLine:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/ClubStatus'
        opensTodayAtLocal:
          type:
            - string
            - 'null'
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
          description: Время открытия сегодня (локальное) для витрины.
    ClubCreateRequest:
      type: object
      description: Создание клуба. Клуб создаётся в статусе `DRAFT`; публикация — отдельный шаг (требует layout, ресурсов и расписания).
      required:
        - name
        - slug
        - timezone
        - currency
        - addressLine
        - city
        - countryCode
        - defaultPriceMinor
      properties:
        name:
          type: string
          maxLength: 160
          example: Caspian Esports Almaty
        slug:
          type: string
          maxLength: 120
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,118}[a-z0-9])?$
          description: Уникален в пределах организации → занят = `409 CLUB_SLUG_TAKEN`.
          example: caspian-almaty
        description:
          type: string
          maxLength: 2000
        timezone:
          type: string
          maxLength: 64
          example: Asia/Almaty
        currency:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          example: KZT
        phoneE164:
          type: string
          maxLength: 20
          pattern: ^\+[1-9]\d{1,14}$
        addressLine:
          type: string
          maxLength: 300
        city:
          type: string
          maxLength: 120
        countryCode:
          type: string
          maxLength: 2
          pattern: ^[A-Z]{2}$
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        defaultPriceMinor:
          type: string
          pattern: ^\d+$
          description: Базовая почасовая цена в minor units.
          example: '120000'
        reservationHorizonMinutes:
          type: integer
          minimum: 1
          default: 1440
        arrivalGraceMinutes:
          type: integer
          minimum: 1
          default: 10
        cancellationCutoffMinutes:
          type: integer
          minimum: 1
          default: 180
    ClubUpdateRequest:
      type: object
      description: Обновление клуба. Незаполненные поля не изменяются. Изменения политики бронирования не применяются к уже существующим броням.
      properties:
        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 120
          pattern: ^[a-z0-9](?:[a-z0-9-]{1,118}[a-z0-9])?$
        description:
          type: string
          maxLength: 2000
        phoneE164:
          type:
            - string
            - 'null'
          maxLength: 20
          pattern: ^\+[1-9]\d{1,14}$
        addressLine:
          type: string
          maxLength: 300
        city:
          type: string
          maxLength: 120
        latitude:
          type:
            - number
            - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
            - number
            - 'null'
          minimum: -180
          maximum: 180
        defaultPriceMinor:
          type: string
          pattern: ^\d+$
          description: Базовая почасовая цена в minor units.
        reservationHorizonMinutes:
          type: integer
          minimum: 1
        arrivalGraceMinutes:
          type: integer
          minimum: 1
        cancellationCutoffMinutes:
          type: integer
          minimum: 1
        settings:
          type: object
          description: Клубные feature-флаги (deep merge).
    WorkingHoursEntry:
      type: object
      description: Интервал рабочих часов клуба в недельном расписании (normalized recurring opening).
      required:
        - dayOfWeek
        - opensAtLocal
        - closesAtLocal
        - closesNextDay
        - isClosed
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор интервала (управляемый вид).
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: 'ISO-номер дня: 1 — понедельник … 7 — воскресенье.'
          example: 1
        opensAtLocal:
          type: string
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
          description: Время открытия (локальное, HH:MM).
          example: '10:00'
        closesAtLocal:
          type: string
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
          description: Время закрытия (локальное, HH:MM).
          example: '02:00'
        closesNextDay:
          type: boolean
          description: Пересекает ли интервал полночь (закрытие на следующий день).
          default: false
        isClosed:
          type: boolean
          description: День/интервал отмечен как закрытый (не интерпретировать как открытый).
          default: false
    WorkingHoursUpdateRequest:
      type: object
      description: Полная замена недельного расписания клубов. Интервалы одного дня не должны пересекаться.
      required:
        - entries
      properties:
        entries:
          type: array
          description: Набор интервалов (несколько в день допустимы для перерывов).
          items:
            $ref: '#/components/schemas/WorkingHoursEntry'
    ClosureType:
      type: string
      description: Тип временного перекрытия расписания клуба.
      enum:
        - MAINTENANCE
        - HOLIDAY
        - EMERGENCY
        - SPECIAL_HOURS
      example: HOLIDAY
    ClubClosure:
      type: object
      description: Временное перекрытие расписания клуба (закрытие или специальные часы), приоритетнее недельных рабочих часов.
      required:
        - id
        - clubId
        - startsAt
        - endsAt
        - closureType
        - isClosed
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        clubId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: Начало перекрытия.
        endsAt:
          type: string
          format: date-time
          description: Окончание перекрытия; должно быть позже `startsAt`.
        closureType:
          $ref: '#/components/schemas/ClosureType'
        isClosed:
          type: boolean
          description: '`true` — закрытие; `false` — специальные часы работы (например, праздничное расширение).'
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Причина (внутренняя/публичная).
        createdByUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: Админ/владелец, создавший перекрытие.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClubClosureCreateRequest:
      type: object
      description: Создание временного перекрытия расписания клуба.
      required:
        - startsAt
        - endsAt
        - closureType
        - isClosed
      properties:
        startsAt:
          type: string
          format: date-time
          description: Начало перекрытия.
        endsAt:
          type: string
          format: date-time
          description: Окончание перекрытия; `endsAt > startsAt`.
        closureType:
          $ref: '#/components/schemas/ClosureType'
        isClosed:
          type: boolean
          description: '`true` — закрытие; `false` — специальные часы работы.'
        reason:
          type: string
          maxLength: 500
          description: Причина.
    ClubActionRequest:
      type: object
      description: Действие жизненного цикла клуба (publish/maintenance/reopen/close). Для maintenance/close требуется причина.
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 240
          description: Причина действия; аудируется.
        expectedEndAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Ожидаемое завершение (для `MAINTENANCE`); необязательно.
    ResourceStatus:
      type: string
