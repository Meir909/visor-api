        - Запрос не меняет бронь до решения.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationExtensionRequestCreate'
            examples:
              extend:
                value:
                  requestedEndAt: '2026-08-04T19:00:00Z'
                  reason: Хочу поиграть ещё
      responses:
