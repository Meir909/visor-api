      enum:
        - PRICING_OPPORTUNITY
        - PROMOTION_SUGGESTION
        - HOURS_OPTIMIZATION
        - RESOURCE_UTILIZATION
    RecommendationPriority:
      type: string
      description: Приоритет рекомендации.
      enum:
        - HIGH
        - MEDIUM
        - LOW
    Recommendation:
      type: object
      description: Рекомендация владельцу, построенная на детерминированных правилах MVP из аналитики.
      required:
        - id
        - type
        - priority
        - title
        - description
        - rationale
        - suggestedAction
        - generatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор рекомендации.
          example: 7c8d9e0f-1a2b-4c3d-9e4f-5a6b7c8d9e0f
        type:
          $ref: '#/components/schemas/RecommendationType'
        priority:
          $ref: '#/components/schemas/RecommendationPriority'
        title:
          type: string
          description: Краткое название.
          example: Поднять цену в пиковые часы
        description:
          type: string
          description: Развёрнутое описание.
          example: С 20:00 до 22:00 загрузка стабильно выше 85% две недели подряд
        rationale:
          type: string
          description: Правило/данные, на которых построена рекомендация.
          example: Пиковые часы 20:00-22:00, средняя загрузка 0.87, отсутствует пиковая надбавка
        suggestedAction:
          type: string
